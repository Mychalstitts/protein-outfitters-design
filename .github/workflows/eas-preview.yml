# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - name: Fetch and gunzip iOS logs
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          ID=6b083cb9-ba19-4555-b6ba-486c5736a034
          eas build:view "$ID" --json > /tmp/ios-build.json
          python3 <<'PY'
          import json, urllib.request, gzip, io, re
          raw=open("/tmp/ios-build.json").read()
          d=json.loads(raw[raw.find("{"):])
          print("error", d.get("error"))
          urls=d.get("logFiles") or []
          for i,u in enumerate(urls):
            with urllib.request.urlopen(u, timeout=90) as r:
              data=r.read()
            # try gzip
            try:
              text=gzip.GzipFile(fileobj=io.BytesIO(data)).read().decode("utf-8","replace")
            except Exception:
              text=data.decode("utf-8","replace")
            open(f"/tmp/log-{i}.txt","w").write(text)
            lines=text.splitlines()
            print(f"LOG {i}: lines={len(lines)} bytes={len(text)}")
            hits=[ln for ln in lines if re.search(r"(?i)error|fail|pod |cocoapods|conflict|unable|ENOENT|undefined|new.?arch|RCT-|fatal|Install pods|phase", ln)]
            print("--- hits (last 150) ---")
            for ln in hits[-150:]:
              print(ln)
            print("--- last 100 ---")
            print("\n".join(lines[-100:]))
          PY
