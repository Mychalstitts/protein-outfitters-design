# EAS preview build on PRs that touch the mobile app.
#
# Preview binaries listen on the `preview` EAS Update channel
# (mobile/apps/mobile/eas.json). JS-only follow-ups: Actions → EAS Update.
#
# Requires Actions secret:
#   EXPO_TOKEN — expo.dev → Account Settings → Access Tokens
#
# Opt-in: only runs on PRs labeled "mobile-build".

name: EAS preview

on:
  pull_request:
    types: [labeled]

jobs:
  build:
    if: github.event.label.name == 'mobile-build'
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      # Node 22 for eas-cli@latest (@oclif/plugin-autocomplete engines.node >=22).
      # Keep mobile/.nvmrc on 20 for Expo SDK 51 local/dev and mobile-ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - run: eas build --profile preview --platform ${{ matrix.platform }} --non-interactive --no-wait
        working-directory: mobile/apps/mobile
