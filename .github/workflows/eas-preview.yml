# EAS preview build on PRs that touch the mobile app.
#
# Preview binaries listen on the `preview` EAS Update channel
# (mobile/apps/mobile/eas.json). JS-only follow-ups: Actions → EAS Update.
#
# Requires Actions secret:
#   EXPO_TOKEN — expo.dev → Account Settings → Access Tokens
#
# Opt-in: only runs on PRs labeled "mobile-build" (or synchronize while labeled).

name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  # Temporary: skip enqueueing new builds while diagnosing remote ERRORED iOS.
  build:
    if: false
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - run: eas build --profile preview --platform ${{ matrix.platform }} --non-interactive --no-wait
        working-directory: mobile/apps/mobile

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - name: Query EAS builds via GraphQL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          token = os.environ["EXPO_TOKEN"]
          ids = [
            "6b083cb9-ba19-4555-b6ba-486c5736a034",
            "30eb0ce5-8c60-4005-a776-b2774d9a0303",
          ]
          query = """
          query($id: ID!) {
            builds {
              byId(buildId: $id) {
                id
                status
                platform
                buildProfile
                distribution
                isForIosSimulator
                appIdentifier
                message
                completedAt
                logFileUrls
                artifacts {
                  buildUrl
                  applicationArchiveUrl
                }
                error {
                  errorCode
                  message
                }
              }
            }
          }
          """

          def gql(qid):
            body = json.dumps({"query": query, "variables": {"id": qid}}).encode()
            req = urllib.request.Request(
              "https://api.expo.dev/graphql",
              data=body,
              headers={
                "Content-Type": "application/json",
                "Authorization": f"Bearer {token}",
              },
              method="POST",
            )
            with urllib.request.urlopen(req, timeout=60) as resp:
              return json.load(resp)

          for bid in ids:
            print(f"=== {bid} ===")
            data = gql(bid)
            if data.get("errors"):
              # Never print token; errors are safe
              print(json.dumps({"errors": data["errors"]}, indent=2)[:4000])
              continue
            b = data["data"]["builds"]["byId"]
            err = b.get("error") or {}
            print(json.dumps({
              "id": b.get("id"),
              "status": b.get("status"),
              "platform": b.get("platform"),
              "buildProfile": b.get("buildProfile"),
              "distribution": b.get("distribution"),
              "isForIosSimulator": b.get("isForIosSimulator"),
              "appIdentifier": b.get("appIdentifier"),
              "errorCode": err.get("errorCode") if isinstance(err, dict) else None,
              "errorMessage": err.get("message") if isinstance(err, dict) else err,
              "message": b.get("message"),
              "artifacts": b.get("artifacts"),
              "logFileUrls": b.get("logFileUrls"),
              "completedAt": b.get("completedAt"),
            }, indent=2))
            # Fetch last ~80 lines of first log file if present (public signed URL)
            urls = b.get("logFileUrls") or []
            if urls and b.get("status") == "ERRORED":
              try:
                with urllib.request.urlopen(urls[0], timeout=60) as lr:
                  text = lr.read().decode("utf-8", errors="replace")
                lines = text.strip().splitlines()
                print("--- log tail ---")
                print("\n".join(lines[-80:]))
              except Exception as e:
                print(f"(could not fetch logs: {type(e).__name__})")
          PY
