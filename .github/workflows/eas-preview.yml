# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - name: Dump full build JSON keys + phase logs
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          ID=6b083cb9-ba19-4555-b6ba-486c5736a034
          eas build:view "$ID" --json > /tmp/ios-build.json
          python3 <<'PY'
          import json
          raw=open("/tmp/ios-build.json").read()
          d=json.loads(raw[raw.find("{"):])
          print("TOP_KEYS", sorted(d.keys()))
          # Print compact summary of all non-huge fields
          for k,v in sorted(d.items()):
            s=json.dumps(v, default=str)
            if len(s)>500:
              print(f"{k}: <len {len(s)}> sample={s[:400]}")
            else:
              print(f"{k}: {s}")
          PY
          # Try eas CLI for logs if available
          eas build:view "$ID" 2>&1 | head -80 || true
          # Common artifact log endpoint patterns via expo API used by CLI
          # npx may expose: eas build:inspect
          eas build --help 2>&1 | head -5 || true
          (eas build:view --help 2>&1 || true) | head -40
