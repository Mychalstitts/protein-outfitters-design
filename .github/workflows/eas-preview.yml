# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - name: Fetch iOS install-pods log
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          ID=6b083cb9-ba19-4555-b6ba-486c5736a034
          eas build:view "$ID" --json > /tmp/ios-build.json
          python3 <<'PY'
          import json, urllib.request, re
          raw=open("/tmp/ios-build.json").read()
          d=json.loads(raw[raw.find("{"):])
          print("status", d.get("status"))
          print("error", d.get("error"))
          urls=d.get("logFileUrls") or []
          print("logFileUrls count", len(urls))
          for i,u in enumerate(urls):
            print(f"URL[{i}]", u[:120], "...")
            try:
              with urllib.request.urlopen(u, timeout=90) as r:
                text=r.read().decode("utf-8","replace")
            except Exception as e:
              print("fetch fail", type(e).__name__, e)
              continue
            open(f"/tmp/log-{i}.txt","w").write(text)
            # Find Install pods / error sections
            lines=text.splitlines()
            print(f"log[{i}] lines={len(lines)} bytes={len(text)}")
            # Print lines mentioning error/fail/pod
            hits=[ln for ln in lines if re.search(r"error|Error|FAILED| cocopod|pod install|CocoaPods|Unable|conflict", ln)]
            print("--- matching lines (up to 80) ---")
            for ln in hits[-80:]:
              print(ln)
            print("--- last 60 lines ---")
            print("\n".join(lines[-60:]))
          PY
