# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - name: View builds
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          for id in 6b083cb9-ba19-4555-b6ba-486c5736a034 30eb0ce5-8c60-4005-a776-b2774d9a0303; do
            echo "=== $id ==="
            eas build:view "$id" --json | python3 -c '
          import json,sys,urllib.request
          raw=sys.stdin.read()
          i=raw.find("{")
          d=json.loads(raw[i:])
          err=d.get("error") or {}
          arts=d.get("artifacts") or {}
          out={
            "id": d.get("id"),
            "status": d.get("status"),
            "platform": d.get("platform"),
            "buildProfile": d.get("buildProfile"),
            "distribution": d.get("distribution"),
            "isForIosSimulator": d.get("isForIosSimulator"),
            "appIdentifier": d.get("appIdentifier"),
            "errorCode": err.get("errorCode") if isinstance(err, dict) else None,
            "errorMessage": err.get("message") if isinstance(err, dict) else err,
            "errorPhase": err.get("buildPhase") if isinstance(err, dict) else None,
            "message": d.get("message"),
            "buildUrl": arts.get("buildUrl") if isinstance(arts, dict) else None,
            "applicationArchiveUrl": arts.get("applicationArchiveUrl") if isinstance(arts, dict) else None,
            "completedAt": d.get("completedAt"),
          }
          print(json.dumps(out, indent=2))
          urls=d.get("logFileUrls") or []
          if urls and d.get("status")=="ERRORED":
            try:
              with urllib.request.urlopen(urls[0], timeout=60) as r:
                lines=r.read().decode("utf-8","replace").splitlines()
              print("--- log tail ---")
              print("\n".join(lines[-100:]))
            except Exception as e:
              print("log fetch failed:", type(e).__name__, str(e)[:200])
          '
          done
