# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - name: Detect log compression + extract text
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          ID=6b083cb9-ba19-4555-b6ba-486c5736a034
          eas build:view "$ID" --json > /tmp/ios-build.json
          python3 <<'PY'
          import json, urllib.request, gzip, zlib
          raw=open("/tmp/ios-build.json").read()
          d=json.loads(raw[raw.find("{"):])
          urls=d.get("logFiles") or []
          u=urls[0]
          with urllib.request.urlopen(u, timeout=90) as r:
            data=r.read()
            ctype=r.headers.get("Content-Type")
            cenc=r.headers.get("Content-Encoding")
          print("bytes", len(data), "ctype", ctype, "cenc", cenc)
          print("magic", data[:16].hex())
          candidates=[]
          candidates.append(("raw", data))
          try:
            candidates.append(("gzip", gzip.decompress(data)))
          except Exception as e:
            print("gzip fail", e)
          try:
            candidates.append(("zlib", zlib.decompress(data)))
          except Exception as e:
            print("zlib fail", e)
          for w in (16+zlib.MAX_WBITS, -zlib.MAX_WBITS, zlib.MAX_WBITS):
            try:
              candidates.append((f"zlib{w}", zlib.decompress(data, w)))
            except Exception:
              pass
          try:
            import zstandard as zstd
            candidates.append(("zstd", zstd.ZstdDecompressor().decompress(data)))
          except Exception as e:
            print("zstd skip", type(e).__name__)
          try:
            import brotli
            candidates.append(("brotli", brotli.decompress(data)))
          except Exception as e:
            print("brotli skip", type(e).__name__)

          for name, blob in candidates:
            sample=blob[:5000]
            printable=sum(32 <= b < 127 or b in (9,10,13) for b in sample)/max(1,len(sample))
            print(f"candidate {name}: len={len(blob)} printable={printable:.2f}")
            if printable > 0.7:
              text=blob.decode("utf-8","replace")
              lines=text.splitlines()
              print(f"--- {name} hits ---")
              for ln in lines:
                low=ln.lower()
                if any(k in low for k in ("error","fail","pod","install pods","cocoapods","enoent","conflict","fatal","new architecture","unable")):
                  print(ln)
              print(f"--- {name} last 80 ---")
              print("\n".join(lines[-80:]))
              break
          else:
            print("NO printable candidate")
          PY
