# EAS preview — temporary diagnose job (build enqueue disabled).
name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  build:
    if: false
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - run: 'true'

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Diagnose builds
        working-directory: mobile/apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_NO_TELEMETRY: 1
        run: |
          set -uo pipefail
          eas whoami || true
          echo "--- build:list ---"
          eas build:list --limit 5 --non-interactive --json > /tmp/list.json 2>/tmp/list.err || true
          echo "list stderr:"; head -c 3000 /tmp/list.err || true
          echo
          echo "list stdout head:"; head -c 4000 /tmp/list.json || true
          echo
          for id in 6b083cb9-ba19-4555-b6ba-486c5736a034 30eb0ce5-8c60-4005-a776-b2774d9a0303; do
            echo "=== view $id ==="
            eas build:view "$id" --json --non-interactive >"/tmp/view-$id.json" 2>"/tmp/view-$id.err" || true
            echo "stderr:"; head -c 4000 "/tmp/view-$id.err" || true
            echo
            echo "stdout:"; head -c 6000 "/tmp/view-$id.json" || true
            echo
          done
          # GraphQL with several auth header variants (never print token)
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["EXPO_TOKEN"]
          q='query($id:ID!){builds{byId(buildId:$id){id status platform error{errorCode message} isForIosSimulator distribution buildProfile artifacts{buildUrl applicationArchiveUrl} logFileUrls}}}'
          body=json.dumps({"query":q,"variables":{"id":"6b083cb9-ba19-4555-b6ba-486c5736a034"}}).encode()
          headers_list=[
            {"Content-Type":"application/json","Authorization":f"Bearer {token}"},
            {"Content-Type":"application/json","Authorization":f"Token {token}"},
            {"Content-Type":"application/json","expo-session":token},
          ]
          for h in headers_list:
            label=list(h.keys())
            try:
              req=urllib.request.Request("https://api.expo.dev/graphql", data=body, headers=h, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                data=json.load(r)
              print("AUTH_OK", label)
              # redact nothing secret in response
              print(json.dumps(data, indent=2)[:5000])
              break
            except urllib.error.HTTPError as e:
              print("AUTH_FAIL", label, e.code, e.read()[:300])
          PY
