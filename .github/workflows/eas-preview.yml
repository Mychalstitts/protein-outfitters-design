# EAS preview build on PRs that touch the mobile app.
#
# Preview binaries listen on the `preview` EAS Update channel
# (mobile/apps/mobile/eas.json). JS-only follow-ups: Actions → EAS Update.
#
# Requires Actions secret:
#   EXPO_TOKEN — expo.dev → Account Settings → Access Tokens
#
# Opt-in: only runs on PRs labeled "mobile-build" (or synchronize while labeled).

name: EAS preview

on:
  pull_request:
    types: [labeled, synchronize]

jobs:
  # Temporary: skip enqueueing new builds while diagnosing remote ERRORED iOS.
  build:
    if: false
    name: Build preview for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - run: eas build --profile preview --platform ${{ matrix.platform }} --non-interactive --no-wait
        working-directory: mobile/apps/mobile

  status:
    if: >-
      github.event.label.name == 'mobile-build' ||
      (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'mobile-build'))
    name: Recent EAS build status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: View target builds
        working-directory: mobile/apps/mobile
        run: |
          set -euo pipefail
          for id in 6b083cb9-ba19-4555-b6ba-486c5736a034 30eb0ce5-8c60-4005-a776-b2774d9a0303; do
            echo "=== $id ==="
            # Capture JSON; keep stderr visible for diagnosis
            if ! OUT=$(eas build:view "$id" --json --non-interactive); then
              echo "eas build:view failed for $id"
              continue
            fi
            printf '%s\n' "$OUT" | python3 -c '
          import json,sys
          raw=sys.stdin.read()
          # eas may print non-json banners; find first {
          i=raw.find("{")
          if i<0:
            print("NO_JSON"); print(raw[:2000]); raise SystemExit(1)
          d=json.loads(raw[i:])
          err=d.get("error") or {}
          arts=d.get("artifacts") or {}
          print(json.dumps({
            "id": d.get("id"),
            "status": d.get("status"),
            "platform": d.get("platform"),
            "buildProfile": d.get("buildProfile"),
            "distribution": d.get("distribution"),
            "isForIosSimulator": d.get("isForIosSimulator"),
            "appIdentifier": d.get("appIdentifier"),
            "errorCode": err.get("errorCode") if isinstance(err, dict) else None,
            "errorMessage": err.get("message") if isinstance(err, dict) else err,
            "message": d.get("message"),
            "buildUrl": arts.get("buildUrl") if isinstance(arts, dict) else None,
            "applicationArchiveUrl": arts.get("applicationArchiveUrl") if isinstance(arts, dict) else None,
            "logFileUrls": d.get("logFileUrls"),
            "completedAt": d.get("completedAt"),
          }, indent=2))
          '
          done
