# Typecheck + tests for the nested mobile workspace (apps/mobile + packages/shared).
#
# Path-filtered so static-site-only commits don't run it. Install happens inside
# mobile/ (its own npm workspaces root) — not the design-repo root.

name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared package — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace packages/shared
      - run: npm test --workspace packages/shared

  mobile:
    name: Mobile — typecheck + Expo doctor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace apps/mobile
      - run: npx expo-doctor
        working-directory: mobile/apps/mobile
        continue-on-error: true
