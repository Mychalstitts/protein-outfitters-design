# Publish a JS/asset OTA to an EAS Update channel.
#
# Channels match mobile/apps/mobile/eas.json (development / preview / production).
#
# Requires EXPO_TOKEN in Actions secrets. Manual only — never auto-publishes
# production on push.
#
# Usage: Actions → EAS Update → Run workflow → pick channel.

name: EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel that installed binaries will pull from
        required: true
        type: choice
        options:
          - preview
          - production
          - development
        default: preview
      message:
        description: What changed (shows in Expo dashboard)
        required: false
        default: JS update

jobs:
  publish:
    name: Publish to ${{ inputs.channel }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 for eas-cli@latest (@oclif/plugin-autocomplete engines.node >=22).
      # Keep mobile/.nvmrc on 20 for Expo SDK 51 local/dev and mobile-ci.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        working-directory: mobile
      - run: >
          eas update
          --channel ${{ inputs.channel }}
          --message "${{ inputs.message }}"
          --non-interactive
        working-directory: mobile/apps/mobile
