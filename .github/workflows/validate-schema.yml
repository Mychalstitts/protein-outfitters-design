name: Static checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-jsonld:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Root package.json has no Expo workspaces; mobile installs under mobile/.
        run: npm install

      - name: Validate JSON-LD in all HTML files
        run: npm run validate:jsonld

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint (parse-check every JS file + duplicate-decl scan)
        run: npm run lint
      - name: Unit tests (harvest label + Stittsworth fees/compass)
        run: npm run test:unit

  test-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Auth integration tests against live production
        run: npm run test:auth
