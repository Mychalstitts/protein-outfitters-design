# Auto-merge PRs labeled `auto-merge` once required checks pass.
name: Auto-merge audit PRs
on:
  pull_request:
    types: [labeled, synchronize, opened]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  automerge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge') || github.event_name == 'check_suite'
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: 'auto-merge,!do-not-merge'
          MERGE_METHOD: 'squash'
          MERGE_RETRIES: '6'
          MERGE_RETRY_SLEEP: '60000'
