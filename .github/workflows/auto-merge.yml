# Auto-merge any PR labeled "auto-merge" once required checks pass.
# Used by the audit workflow + manual hot-fix PRs from the audit task.
name: Auto-merge labeled PRs
on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    steps:
      - uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_LABELS: auto-merge
          MERGE_METHOD: squash
          MERGE_RETRIES: 6
          MERGE_RETRY_SLEEP: 60000
