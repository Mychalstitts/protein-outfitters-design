<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Farm · Protein Outfitters</title>
<meta property="og:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<meta name="twitter:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Root-absolute assets: /farm/:slug rewrites break relative ./theme.css → /farm/theme.css -->
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/po-shell.css" />
  <link rel="stylesheet" href="/po-social.css" />
  <style>
    body{ background: var(--bg, #fbf9f5); }
    :root{ --parchment: var(--bg, #fbf9f5); }
    .farm-cover{ height: min(42vw, 360px); min-height: 220px; background: linear-gradient(135deg, #061b0e, #0e2c19); background-size: cover; background-position: center; position: relative; }
    .farm-cover::after{ content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.5)); }
    .farm-shell{ max-width: 1120px; margin: -72px auto 0; padding: 0 var(--shell-pad, 24px) 96px; position: relative; z-index: 2; }
    .farm-id{
      display: grid; grid-template-columns: 96px 1fr auto; gap: 20px; align-items: center;
      background: #fff; border-radius: 20px; padding: 22px 24px;
      border: 1px solid rgba(6,27,14,.06); box-shadow: 0 8px 28px rgba(6,27,14,.08);
    }
    @media (max-width: 720px) {
      .farm-id{ grid-template-columns: 72px 1fr; gap: 14px; padding: 18px; border-radius: 18px; }
      .farm-actions{ grid-column: 1 / -1; }
      .farm-id h1{ font-size: 24px !important; }
    }
    .farm-avatar{
      width: 96px; height: 96px; border-radius: 50%;
      background: #061b0e center/cover no-repeat;
      display: grid; place-items: center; color: #fbf9f5;
      font: 700 30px/1 'Inter', system-ui, sans-serif;
      flex-shrink: 0; overflow: hidden;
    }
    @media (max-width: 720px) { .farm-avatar{ width: 72px; height: 72px; font-size: 24px; } }
    .farm-id h1{ margin: 0; font: 700 clamp(24px, 3vw, 32px)/1.15 'Inter', system-ui, sans-serif; letter-spacing: -.02em; color: var(--ink, #061b0e); }
    .farm-id p{ margin: 6px 0 0; color: var(--ink-2, rgba(6,27,14,.65)); font: 500 14px/1.45 'Inter', system-ui, sans-serif; }
    .farm-actions{ display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-follow, .btn-share{
      background: rgba(6,27,14,.06); color: var(--ink, #061b0e); border: 0;
      padding: 10px 16px; border-radius: 999px; font: 600 13px/1 'Inter', system-ui, sans-serif; cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }
    .btn-follow:hover, .btn-share:hover{ background: rgba(6,27,14,.1); }
    .btn-follow.followed{ background: var(--ink, #061b0e); color: #fbf9f5; }
    .farm-stats{ display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
    .farm-stat{ background: #fff; border-radius: 14px; padding: 16px 18px; border: 1px solid rgba(6,27,14,.06); }
    .farm-stat .num{ font: 700 24px/1 'Inter', system-ui, sans-serif; color: var(--ink, #061b0e); letter-spacing: -.02em; }
    .farm-stat .lab{ font: 600 11px/1.3 'Inter', system-ui, sans-serif; color: var(--ink-2, rgba(6,27,14,.6)); margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; }
    .farm-section{ margin-top: 32px; }
    .farm-section h2{ font: 700 24px/1.2 'Inter', system-ui, sans-serif; letter-spacing: -.02em; color: var(--ink, #061b0e); margin: 0 0 14px; }
    .farm-section > p.farm-section-lead{
      font: 500 15px/1.55 'Inter', system-ui, sans-serif; color: var(--ink-2, rgba(6,27,14,.65));
      margin: 0 0 18px; max-width: 52ch;
    }
    .listings-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .product{
      background: #fff; border-radius: 16px; overflow: hidden; border: 1px solid rgba(6,27,14,.06);
      cursor: pointer; transition: box-shadow .22s ease, border-color .22s ease;
      display: flex; flex-direction: column; padding: 0; text-align: left; font: inherit; color: inherit; width: 100%;
    }
    .product:hover{ box-shadow: 0 8px 24px rgba(6,27,14,.08); border-color: rgba(6,27,14,.1); }
    .product-photo{ aspect-ratio: 4/3; background-size: cover; background-position: center; position: relative; background-color: #1a0d08; }
    .product-tag{ position: absolute; top: 12px; left: 12px; background: rgba(251,249,245,.94); padding: 5px 10px; border-radius: 999px; font: 600 11px/1 'Inter', system-ui, sans-serif; color: var(--ink, #061b0e); }
    .product-meta{ padding: 14px 16px 16px; }
    .product-eyebrow{ font: 600 11px/1 'Inter'; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3, rgba(6,27,14,.5)); }
    .product-name{ font: 700 16px/1.3 'Inter'; color: var(--ink, #061b0e); margin: 6px 0; letter-spacing: -.015em; }
    .product-detail{ font: 500 13px/1.45 'Inter'; color: var(--ink-2, rgba(6,27,14,.65)); margin: 0 0 10px; }
    .product-foot{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .product-price{ font: 600 14px/1 'Inter'; color: var(--ink, #061b0e); }
    .product-cta{ font: 600 13px/1 'Inter'; color: var(--ink, #061b0e); opacity: .7; }
    .farm-bio{
      background: #fff; border-radius: 18px; padding: 26px 28px;
      line-height: 1.6; font: 500 15px/1.6 'Inter', system-ui, sans-serif;
      color: var(--ink, #061b0e); border: 1px solid rgba(6,27,14,.06);
    }
    .cert-grid{ display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .cert-chip{ padding: 7px 12px; background: rgba(6,27,14,.06); color: var(--ink, #061b0e); border: 0; border-radius: 999px; font: 600 12px/1 'Inter', system-ui, sans-serif; }
    .cert-chip.identity{ background: rgba(6,27,14,.06); color: var(--ink, #061b0e); }

    /* Community wall — contain posts in a proper card */
    #fpWall.po-soc,
    #fpWall{
      background: #fff;
      border: 1px solid rgba(6,27,14,.06);
      border-radius: 18px;
      overflow: hidden;
      min-height: 120px;
    }
    #fpWall .po-soc-composer{
      margin: 0; border: 0; border-bottom: 1px solid rgba(6,27,14,.06); border-radius: 0;
      box-shadow: none;
    }
    #fpWall .po-soc-list{ margin: 0; }
    #fpWall .po-soc-empty{
      border: 0; border-radius: 0; background: transparent;
      padding: 48px 24px; margin: 0;
    }
    #fpWall .po-soc-post{ padding: 18px 20px; }
    #fpWall .po-soc-post:last-child{ border-bottom: 0; }
  </style>
</head>
<body>
  <div class="po-nav-wrap">
    <nav class="po-nav" aria-label="Primary">
      <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
      <div class="po-nav-links">
        <a href="/discover">Browse</a>
        <a href="/#how">How it works</a>
        <a href="/producers" class="active">Farms</a>
        <a href="/#partners">For partners</a>
      </div>
      <div class="po-nav-actions"><a href="/account" class="signin">Sign in</a><a class="po-nav-cta" href="/discover">Browse animals</a></div>
    </nav>
  </div>
  <main>
    <div class="farm-cover" id="fpCover"></div>
    <section class="farm-shell">
      <div class="farm-id">
        <div class="farm-avatar" id="fpAvatar">F</div>
        <div>
          <h1 id="fpName">Loading…</h1>
          <p id="fpLoc">—</p>
        </div>
        <div class="farm-actions">
          <button class="btn-follow" id="fpFollow">+ Follow</button>
          <button class="btn-share">Share</button>
        </div>
      </div>

      <div class="farm-stats" id="fpStats"></div>

      <div class="po-soc-tabs" role="tablist" aria-label="Farm sections">
        <button type="button" class="po-soc-tab active" data-tab="story" role="tab" aria-selected="true">Story</button>
        <button type="button" class="po-soc-tab" data-tab="animals" role="tab" aria-selected="false">Animals</button>
        <button type="button" class="po-soc-tab" data-tab="community" role="tab" aria-selected="false">Community</button>
      </div>

      <section class="farm-section po-soc-panel" data-panel="story">
        <h2>About</h2>
        <div class="farm-bio" id="fpBio">Loading…</div>
      </section>

      <section class="farm-section po-soc-panel" data-panel="animals" hidden>
        <h2 id="fpListingsTitle">Active listings</h2>
        <div class="listings-grid" id="fpGrid"></div>
      </section>

      <section class="farm-section po-soc-panel" data-panel="community" hidden id="community">
        <h2>Community</h2>
        <p class="farm-section-lead">Updates from this ranch — harvest notes, pasture photos, and the animals you follow.</p>
        <div id="fpWall" class="po-soc" aria-live="polite"></div>
      </section>
    </section>
  </main>
  <div id="po-shell-host"></div>
  <script src="/po-shell.js"></script>
  <script src="/po-api.js"></script>
  <script src="/po-social.js"></script>
  <script>
  (async () => {
    const slug = (location.pathname.match(/\/farm\/([^\/]+)/) || [])[1];
    if (!slug) { window.location.replace('/producers'); return; }
    const cap = s => (s || '').replace(/\b\w/g, c => c.toUpperCase());
    const photoFor = sp => sp === 'hog' ? '/img/premium-pig.jpg' : sp === 'lamb' ? '/img/premium-sheep.jpg' : '/img/cattle-pasture.jpg';

    let data;
    try { data = await window.PO_API.farm(slug); }
    catch (e) {
      document.getElementById('fpName').textContent = 'Farm not found';
      document.getElementById('fpBio').textContent = 'No farm with slug "' + slug + '" exists yet. Check the URL or browse all producers.';
      return;
    }
    const f = data.farm;
    document.title = f.name + ' · Protein Outfitters';

    if (f.cover_url) {
      const cover = document.getElementById('fpCover');
      cover.style.backgroundImage = `url('${String(f.cover_url).replace(/'/g, '%27')}')`;
    }
    const av = document.getElementById('fpAvatar');
    if (f.avatar_url) {
      av.style.backgroundImage = `url('${String(f.avatar_url).replace(/'/g, '%27')}')`;
      av.textContent = '';
    } else {
      av.textContent = (f.name || '?').charAt(0).toUpperCase();
    }

    document.getElementById('fpName').textContent = f.name;
    const locParts = [f.city, f.state].filter(Boolean).join(', ');
    document.getElementById('fpLoc').textContent = locParts + (f.established_year ? ' · Established ' + f.established_year : '');

    document.getElementById('fpBio').textContent = f.bio || 'This farm hasn\'t added a bio yet.';

    // Stats
    const listings = data.listings || [];
    const stats = [
      { num: listings.length, lab: 'Active listings' },
      { num: f.established_year ? (new Date().getFullYear() - f.established_year) + ' yrs' : '—', lab: 'Producing since ' + (f.established_year || '?') },
      { num: (f.practices || []).length, lab: 'Practices' },
      { num: (f.certs || []).length, lab: 'Certifications' }
    ];
    document.getElementById('fpStats').innerHTML = stats.map(s => `<div class="farm-stat"><div class="num">${s.num}</div><div class="lab">${s.lab}</div></div>`).join('');

    // Practices + certs + identity chips below bio
    const chipParts = [];
    (f.practices || []).forEach(p => chipParts.push(`<span class="cert-chip">${cap(p.replace('-', ' '))}</span>`));
    (f.certs || []).forEach(c => chipParts.push(`<span class="cert-chip">${c.toUpperCase()}</span>`));
    (f.identity || []).forEach(i => chipParts.push(`<span class="cert-chip identity">${cap(i)}-owned</span>`));
    if (chipParts.length) document.getElementById('fpBio').insertAdjacentHTML('beforeend', `<div class="cert-grid">${chipParts.join('')}</div>`);

    // Listings
    const grid = document.getElementById('fpGrid');
    const titleEl = document.getElementById('fpListingsTitle');
    const browseFarmHref = slug ? `/discover?farm=${encodeURIComponent(slug)}` : '/discover';
    if (!listings.length) {
      titleEl.textContent = 'No listings yet';
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:48px 24px;background:#fff;border-radius:16px;border:1px solid rgba(6,27,14,.06);">
        <img src="/brand/logo-monogram.svg" alt="" width="56" height="56" style="display:block;margin:0 auto 14px;border-radius:13px;opacity:.85" />
        <div style="font:800 18px/1.3 'Inter';letter-spacing:-.02em;margin:0 0 8px;">No animals reserving right now</div>
        <div style="font:500 14px/1.5 'Inter';opacity:.7;max-width:320px;margin:0 auto 18px;">Follow this ranch for updates, or browse other farms with live inventory.</div>
        <a href="/discover" style="display:inline-block;background:#061b0e;color:#fbf9f5;text-decoration:none;border-radius:999px;padding:12px 20px;font:700 13px/1 'Inter';">Browse animals →</a>
      </div>`;
    } else {
      titleEl.innerHTML = `${listings.length === 1 ? '1 animal reserving' : `${listings.length} animals reserving`} <a href="${browseFarmHref}" style="font:700 13px/1 'Inter';color:var(--brand,#061b0e);text-decoration:none;margin-left:10px;white-space:nowrap;">See all on Browse →</a>`;
      grid.innerHTML = listings.map(l => {
        const photo = (l.photos && l.photos[0]) || photoFor(l.species);
        const farmerRate = Number(l.shares?.quarter?.price || l.shares?.half?.price || l.shares?.whole?.price || l.price_per_lb || 0);
        const shareKey = l.shares?.quarter?.available > 0 ? 'quarter' : l.shares?.half?.available > 0 ? 'half' : 'whole';
        const hw = l.estimated_hanging_weight || 700;
        const allIn = window.PO_PRICING ? window.PO_PRICING.allInPerLbHW(farmerRate, shareKey, hw) : farmerRate;
        const practiceLabel = (l.practice && l.practice[0]) ? cap(l.practice[0].replace('-', ' ')) : '';
        return `<button class="product" onclick="window.location='/listing?id=${l.id}'">
          <div class="product-photo" style="background-image:url('${photo}');"><span class="product-tag">Reserving</span></div>
          <div class="product-meta">
            <span class="product-eyebrow">${cap(l.species)}${practiceLabel ? ' · ' + practiceLabel : ''}</span>
            <h3 class="product-name">${l.number ? l.number + ' — ' : ''}${l.breed || cap(l.species)}</h3>
            <p class="product-detail">${l.estimated_hanging_weight ? l.estimated_hanging_weight + ' lb HW · ' : ''}Harvest ${l.expected_finish_date ? new Date(l.expected_finish_date).toLocaleDateString('en',{month:'short',day:'numeric'}) : 'TBD'}</p>
            <div class="product-foot"><span class="product-price">From <strong>$${Number(allIn).toFixed(2)}</strong><span style="font-weight:600;opacity:.6;font-size:12px">/lb all-in</span></span><span class="product-cta">Reserve →</span></div>
          </div>
        </button>`;
      }).join('');
    }

    // Follow button — backed by /api/farm-follow (farm_follows table)
    const fb = document.getElementById('fpFollow');
    function paintFollow(state) {
      fb.classList.toggle('followed', !!state.following);
      const countSuffix = state.count > 0 ? ` · ${state.count}` : '';
      fb.innerHTML = (state.following ? '✓ Following' : '+ Follow') + countSuffix;
      fb.dataset.following = state.following ? '1' : '';
    }
    // Initial state — public read, no auth required (returns following=false if signed-out).
    try {
      const init = await window.PO_API.farmFollowState(f.id);
      paintFollow(init);
    } catch (_) { paintFollow({ following: false, count: 0 }); }

    fb.addEventListener('click', async () => {
      // Need to be signed in to follow / unfollow
      try {
        const me = await window.PO_API.me();
        if (!me || !me.user) {
          window.PO_API.openAuth('Sign in to follow ' + f.name, 'buyer');
          return;
        }
      } catch (_) {
        window.PO_API.openAuth('Sign in to follow ' + f.name, 'buyer');
        return;
      }
      const wasFollowing = fb.dataset.following === '1';
      // Optimistic UI
      fb.disabled = true;
      paintFollow({ following: !wasFollowing, count: parseInt((fb.textContent.match(/\d+/) || ['0'])[0]) + (wasFollowing ? -1 : 1) });
      try {
        const res = wasFollowing
          ? await window.PO_API.unfollowFarm(f.id)
          : await window.PO_API.followFarm(f.id);
        paintFollow(res);
      } catch (e) {
        // Roll back on error
        paintFollow({ following: wasFollowing, count: parseInt((fb.textContent.match(/\d+/) || ['0'])[0]) + (wasFollowing ? 1 : -1) });
        if (e.status === 401) window.PO_API.openAuth('Sign in to follow ' + f.name, 'buyer');
      } finally {
        fb.disabled = false;
      }
    });

    // Tabs: Story · Animals · Community
    function activateTab(name) {
      const tab = document.querySelector(`.po-soc-tab[data-tab="${name}"]`);
      if (!tab) return;
      document.querySelectorAll('.po-soc-tab').forEach(t => {
        t.classList.toggle('active', t === tab);
        t.setAttribute('aria-selected', t === tab ? 'true' : 'false');
      });
      document.querySelectorAll('.po-soc-panel').forEach(p => {
        p.hidden = p.dataset.panel !== name;
      });
      if (name === 'community' && window.PO_SOCIAL && !document.getElementById('fpWall').dataset.mounted) {
        document.getElementById('fpWall').dataset.mounted = '1';
        (async () => {
          let canPost = false;
          try {
            const me = await window.PO_API.me();
            canPost = !!(me.user && (me.user.id === f.owner_id || me.user.role === 'admin'));
          } catch (_) {}
          window.PO_SOCIAL.mountWall(document.getElementById('fpWall'), {
            subjectType: 'farm',
            subjectId: f.id,
            canPost,
            placeholder: "What's happening on the land today?",
            emptyText: 'No posts yet — follow this ranch and check back for harvest updates.',
          });
        })();
      }
    }
    document.querySelectorAll('.po-soc-tab').forEach(tab => {
      tab.addEventListener('click', () => activateTab(tab.dataset.tab));
    });
    // Hash deep-links: #community, #animals, #story (and #communitythis typos → community)
    const hashRaw = (location.hash || '').replace(/^#/, '').toLowerCase();
    const hashTab = ['community', 'animals', 'story'].find(t => hashRaw === t || hashRaw.startsWith(t)) || null;
    if (hashTab) activateTab(hashTab);
    window.addEventListener('hashchange', () => {
      const h = (location.hash || '').replace(/^#/, '').toLowerCase();
      const t = ['community', 'animals', 'story'].find(x => h === x || h.startsWith(x));
      if (t) activateTab(t);
    });

    // Share button — Web Share API with copy-to-clipboard fallback
    document.querySelectorAll('.btn-share').forEach(sb => sb.addEventListener('click', async () => {
      const url = location.href;
      const title = (document.querySelector('.farm-id h1')?.textContent || 'Farm on Protein Outfitters').trim();
      try {
        if (navigator.share) { await navigator.share({ title, url }); return; }
        await navigator.clipboard.writeText(url);
        const orig = sb.textContent;
        sb.textContent = '✓ Link copied';
        setTimeout(() => { sb.textContent = orig; }, 1600);
      } catch (e) { /* user cancelled */ }
    }));
  })();
  </script>
</body>
</html>
