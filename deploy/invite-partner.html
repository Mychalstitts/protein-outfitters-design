<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invite a farm or processor · Protein Outfitters</title>
<meta property="og:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<meta name="twitter:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="stylesheet" href="./theme.css" />
<link rel="stylesheet" href="./po-shell.css" />
<style>
  body { background: #fbf9f5; color: var(--ink); }
  .ip-shell { max-width: 720px; margin: 0 auto; padding: 32px var(--shell-pad) 80px; }
  .ip-card { background: #fff; border-radius: 22px; padding: 32px; box-shadow: 0 1px 2px rgba(6,27,14,.04); }
  .eyebrow { font: 800 12px/1 var(--ff-sans); letter-spacing:.18em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 10px; }
  h1 { font: 900 clamp(32px, 4vw, 44px)/1.05 var(--ff-sans); letter-spacing:-0.022em; margin: 0 0 14px; }
  p.lead { font: 500 16px/1.55 var(--ff-sans); color: var(--ink-2); margin: 0 0 24px; }
  .toggle { display: flex; gap: 0; padding: 4px; background: var(--surface, #f3eedc); border-radius: 14px; max-width: 380px; margin-bottom: 22px; }
  .toggle button { flex: 1; background: transparent; border: 0; padding: 12px 16px; font: 700 14px/1 var(--ff-sans); color: var(--ink-2); cursor: pointer; border-radius: 10px; transition: background .2s; }
  .toggle button.on { background: var(--ink); color: #fbf9f5; }
  label { display: block; font: 700 12px/1 var(--ff-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); margin: 16px 0 6px; }
  input, textarea { width: 100%; box-sizing: border-box; background: var(--surface,#fbf9f5); border: 1.5px solid rgba(6,27,14,.10); border-radius: 12px; padding: 12px 14px; font: 500 15px/1.4 var(--ff-sans); color: var(--ink); }
  input:focus, textarea:focus { outline: 0; border-color: var(--po-pasture, #7da05d); background: #fff; }
  textarea { min-height: 90px; resize: vertical; }
  .submit { background: #061b0e; color: #fbf9f5; border: 0; border-radius: 999px; padding: 14px 24px; font: 700 15px/1 var(--ff-sans); cursor: pointer; margin-top: 20px; transition: transform .15s; }
  .submit:hover:not(:disabled) { transform: translateY(-1px); }
  .submit:disabled { opacity: .5; cursor: wait; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width:520px){ .row { grid-template-columns: 1fr; } }
  .ok, .fail { margin-top: 18px; padding: 14px 16px; border-radius: 12px; font: 600 14px/1.5 var(--ff-sans); }
  .ok { background: rgba(125,160,93,.15); color: #4a6634; }
  .fail { background: rgba(176,74,58,.15); color: #7d2e22; }
</style>
</head>
<body>

<div class="po-nav-wrap">
  <nav class="po-nav">
    <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
    <div class="po-nav-links">
      <a href="/discover">Reserve</a>
      <a href="/producers">Producers</a>
      <a href="/hardware">Hardware</a>
    </div>
    <div class="po-nav-actions">
      <a href="/account" class="signin">Sign in</a>
      <button class="reserve" data-open-sheet>Reserve</button>
    </div>
  </nav>
</div>

<main class="ip-shell">
  <div class="ip-card">
    <p class="eyebrow">Grow the network</p>
    <h1>Invite your local farm or processor.</h1>
    <p class="lead">Don't see your favorite ranch or butcher on Protein Outfitters? Send them a one-click invite. They get a personal claim link, you get the partner you actually want.</p>

    <div class="toggle" role="tablist">
      <button id="tabFarm" class="on" data-kind="farm">Farm / ranch</button>
      <button id="tabProcessor" data-kind="processor">Processor / butcher</button>
    </div>

    <form id="ipForm">
      <label for="ipName">Their name <span style="color:#b04a3a">*</span></label>
      <input id="ipName" name="name" placeholder="e.g. Twin Pines Ranch" required />

      <div class="row">
        <div>
          <label for="ipEmail">Their email <span style="color:#b04a3a">*</span></label>
          <input id="ipEmail" name="email" type="email" placeholder="contact@theirfarm.com" required />
        </div>
        <div>
          <label for="ipPhone">Their phone (optional)</label>
          <input id="ipPhone" name="phone" type="tel" placeholder="(218) 555-0142" />
        </div>
      </div>

      <label for="ipMsg">Personal note (shown in the invite)</label>
      <textarea id="ipMsg" name="message" placeholder="e.g. Hey Mike — I just reserved a half beef nearby and would love to pick mine up at your shop. Would you set up here?"></textarea>

      <div class="row" style="margin-top: 4px;">
        <div>
          <label for="ipMyName">Your name</label>
          <input id="ipMyName" name="inviter_name" placeholder="Mychal Stittsworth" />
        </div>
        <div>
          <label for="ipMyEmail">Your email <span style="color:#b04a3a">*</span></label>
          <input id="ipMyEmail" name="inviter_email" type="email" placeholder="you@example.com" required />
        </div>
      </div>

      <button class="submit" type="submit" id="ipSubmit">Send invite →</button>
    </form>

    <div id="ipResult"></div>
  </div>
</main>

<script src="./po-shell.js"></script>
<script>
let activeKind = 'farm';
const tabFarm = document.getElementById('tabFarm');
const tabProcessor = document.getElementById('tabProcessor');
[tabFarm, tabProcessor].forEach(t => t.addEventListener('click', () => {
  tabFarm.classList.toggle('on', t === tabFarm);
  tabProcessor.classList.toggle('on', t === tabProcessor);
  activeKind = t.dataset.kind;
}));

// Pre-fill the inviter from auth session if available
(async () => {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    if (!r.ok) return;
    const data = await r.json();
    if (data?.user) {
      const e = document.getElementById('ipMyEmail');
      const n = document.getElementById('ipMyName');
      if (e && !e.value) e.value = data.user.email || '';
      if (n && !n.value) n.value = data.user.name || '';
    }
  } catch {}
})();

// Pre-fill from URL params (e.g. ?name=Plant04&kind=processor)
const params = new URLSearchParams(location.search);
if (params.get('kind') === 'processor') tabProcessor.click();
['name', 'email', 'phone', 'message'].forEach(k => {
  const v = params.get(k);
  if (v) document.getElementById('ip' + k.charAt(0).toUpperCase() + k.slice(1))?.setAttribute('value', v);
});

document.getElementById('ipForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('ipSubmit');
  const result = document.getElementById('ipResult');
  result.innerHTML = '';
  btn.disabled = true; btn.textContent = 'Sending…';
  const payload = {
    kind: activeKind,
    name: document.getElementById('ipName').value.trim(),
    email: document.getElementById('ipEmail').value.trim(),
    phone: document.getElementById('ipPhone').value.trim() || undefined,
    message: document.getElementById('ipMsg').value.trim() || undefined,
    inviter_name: document.getElementById('ipMyName').value.trim() || undefined,
    inviter_email: document.getElementById('ipMyEmail').value.trim()
  };
  try {
    const r = await fetch('/api/invite-partner', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    result.innerHTML = `<div class="ok">✅ Invite sent to ${payload.email}. They'll get a personal claim link from us within a minute. Send another?</div>`;
    document.getElementById('ipForm').reset();
  } catch (err) {
    result.innerHTML = `<div class="fail">Couldn't send: ${err.message}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Send invite →';
  }
});
</script>
</body>
</html>
