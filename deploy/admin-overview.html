<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner overview · Protein Outfitters</title>
<meta property="og:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<meta name="twitter:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/po-shell.css" />
<style>
  body { background: #fbf9f5; color: var(--ink); }
  .ov-shell { max-width: 1200px; margin: 0 auto; padding: 28px var(--shell-pad) 80px; }
  .ov-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom: 24px; }
  .ov-head h1 { font: 800 clamp(36px, 4.4vw, 56px)/1.02 var(--ff-sans); letter-spacing:-0.025em; margin: 0; }
  .ov-head .eyebrow { font: 800 12px/1 var(--ff-sans); letter-spacing: 0.08em; text-transform:uppercase; color: var(--ink-2); margin: 0 0 8px; }
  .ov-head p { font: 500 15px/1.5 var(--ff-sans); color: var(--ink-2); margin: 6px 0 0; max-width: 600px; }

  .ov-balance { background: linear-gradient(135deg, #061b0e 0%, #0e2c19 100%); color: #fbf9f5; border-radius: 24px; padding: 28px 32px; margin-bottom: 22px; }
  .ov-balance .lab { font: 800 11px/1 var(--ff-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: .65; margin: 0 0 8px; }
  .ov-balance .v { font: 800 clamp(40px, 5vw, 60px)/1 var(--ff-sans); letter-spacing: -0.03em; }
  .ov-balance .sub { font: 500 13px/1.5 var(--ff-sans); opacity: .7; margin-top: 6px; }
  .ov-balance .pending { display: flex; gap: 24px; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
  .ov-balance .pending div { font: 600 13px/1.4 var(--ff-sans); }
  .ov-balance .pending strong { font-weight: 800; opacity: .92; }

  .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .ov-stat { background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(6,27,14,.04); }
  .ov-stat .lab { font: 700 11px/1 var(--ff-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
  .ov-stat .v { font: 800 clamp(28px, 3vw, 40px)/1 var(--ff-sans); letter-spacing: -0.02em; }
  .ov-stat .v small { font-size: .55em; font-weight: 600; opacity: .55; margin-left: 4px; }

  .ov-cols { display: grid; grid-template-columns: 1.2fr .8fr; gap: 22px; }
  @media (max-width: 880px) { .ov-cols { grid-template-columns: 1fr; } }

  .ov-card { background: #fff; border-radius: 18px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(6,27,14,.04); }
  .ov-card h2 { font: 800 18px/1.2 var(--ff-sans); margin: 0 0 14px; letter-spacing: -0.01em; }
  .ov-card h2 small { font: 600 12px/1 var(--ff-sans); color: var(--ink-2); margin-left: 8px; }

  .ov-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(6,27,14,.06); align-items: center; }
  .ov-row:first-child { border-top: 0; padding-top: 0; }
  .ov-row .meta h4 { margin: 0; font: 700 14px/1.3 var(--ff-sans); }
  .ov-row .meta p { margin: 3px 0 0; font: 500 12px/1.4 var(--ff-sans); color: var(--ink-2); }
  .ov-row .right { text-align: right; font: 700 14px/1 var(--ff-sans); white-space: nowrap; }
  .ov-row .right span.s { display:block; font: 600 10.5px/1.1 var(--ff-sans); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 800 10px/1 var(--ff-sans); letter-spacing: .04em; text-transform: uppercase; }
  .pill-paid { background: rgba(125,160,93,.15); color: #4a6634; }
  .pill-pending { background: rgba(220,165,74,.18); color: #8a6520; }
  .pill-cancelled, .pill-refunded { background: rgba(176,74,58,.15); color: #7d2e22; }
  .pill-succeeded { background: rgba(125,160,93,.15); color: #4a6634; }
  .pill-requires_payment_method, .pill-requires_action, .pill-processing { background: rgba(220,165,74,.18); color: #8a6520; }
  .pill-canceled, .pill-failed { background: rgba(176,74,58,.15); color: #7d2e22; }

  .empty { padding: 32px 12px; text-align: center; color: var(--ink-2); font: 500 14px/1.5 var(--ff-sans); }
  .empty img { width: 56px; height: 56px; border-radius: 12px; display: block; margin: 0 auto 12px; opacity: .55; }
  .needs-auth { background: #fff; padding: 60px 24px; border-radius: 18px; text-align: center; }
  .needs-auth img { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 14px; }
  .ov-act { font:700 12.5px/1 Inter; color:#061b0e; text-decoration:none; border-bottom:1px solid rgba(6,27,14,.2); }
  .ov-btn { border:0; border-radius:999px; padding:8px 14px; font:700 12px/1 Inter; cursor:pointer; background:#061b0e; color:#fbf9f5; }
  .ov-btn.ghost { background:transparent; color:#061b0e; border:1px solid rgba(6,27,14,.14); }
  .ov-jump { display:flex; flex-wrap:wrap; gap:10px; margin: 0 0 22px; }
  .ov-jump a { font:700 13px/1 Inter; color:#061b0e; text-decoration:none; padding:10px 14px; border-radius:999px; background:#fff; border:1px solid rgba(6,27,14,.08); }
</style>
</head>
<body>

<div class="po-nav-wrap">
  <nav class="po-nav">
    <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
    <div class="po-nav-links" data-admin-nav></div>
    <div class="po-nav-actions">
      <a href="/account" class="signin">Sign in</a>
      <button class="reserve" data-open-sheet>Reserve</button>
    </div>
  </nav>
</div>

<main class="ov-shell" id="ovBody">
  <div class="ov-head">
    <div>
      <p class="eyebrow">Owner overview</p>
      <h1>How's the marketplace doing?</h1>
      <p>Listings, buyers, prospects, hardware leads, and Stripe — then jump to the hotspot map to decide who to recruit next.</p>
    </div>
  </div>
  <div id="ovContent">
    <div class="empty"><img src="/brand/logo-monogram.svg" alt="" />Loading metrics…</div>
  </div>
</main>

<script src="/po-api.js"></script>
<script src="/po-shell.js"></script>
<script src="/admin-nav.js"></script>
<script>
(async function () {
  const root = document.getElementById('ovContent');
  const fmt$ = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const date = (ms) => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const dateOnly = (s) => new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  let res;
  // Hard 8s client-side timeout so the page never sits on "Loading metrics…" forever.
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    res = await fetch('/api/admin-metrics', { credentials: 'include', signal: ctrl.signal });
    clearTimeout(t);
  } catch (e) {
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3 style="margin:0 0 8px;font:800 18px/1.3 Inter;">Metrics API timed out</h3><p style="font:500 14px/1.5 Inter;color:#666;">${e.name === 'AbortError' ? 'The metrics endpoint took longer than 8 seconds. Stripe or DB may be slow — refresh in a minute.' : e.message}</p><button onclick="location.reload()" style="margin-top:14px;background:#061b0e;color:#fbf9f5;border:0;border-radius:999px;padding:12px 22px;font:700 14px/1 Inter;cursor:pointer">Retry</button></div>`;
    return;
  }
  if (res.status === 401) {
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3 style="margin:0 0 8px;font:800 18px/1.3 Inter;">Sign in to see metrics</h3><p style="font:500 14px/1.5 Inter;color:#666;">Owner overview requires an admin account.</p><button onclick="window.PO_API.openAuth('Sign in', 'admin')" style="margin-top:14px;background:#061b0e;color:#fbf9f5;border:0;border-radius:999px;padding:12px 22px;font:700 14px/1 Inter;cursor:pointer">Sign in</button></div>`;
    return;
  }
  if (res.status === 403) {
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3 style="margin:0 0 8px;font:800 18px/1.3 Inter;">Admin only</h3><p style="font:500 14px/1.5 Inter;color:#666;">This desk is for platform admins. Signed-in buyers and farms stay on the marketplace.</p></div>`;
    return;
  }
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3>Error</h3><p>${t.slice(0,300)}</p></div>`;
    return;
  }

  const data = await res.json();
  const c = data.counts || {};
  const balanceUSD = (data.balance?.available || []).find(b => b.currency === 'usd')?.amount || 0;
  const pendingUSD = (data.balance?.pending || []).find(b => b.currency === 'usd')?.amount || 0;

  let html = '';

  // Live balance card
  html += `
    <div class="ov-balance">
      <p class="lab">Stripe available balance</p>
      <div class="v">${fmt$(balanceUSD)}</div>
      <p class="sub">Across ${data.counts.paid_deposits_count} paid reservations.${data.stripe_error ? ' <em>(Stripe: ' + data.stripe_error + ')</em>' : ''}</p>
      <div class="pending">
        <div><strong>${fmt$(pendingUSD)}</strong><br>Pending Stripe payouts</div>
        <div><strong>${fmt$(c.pending_deposits_sum)}</strong><br>Reservations awaiting deposit</div>
        <div><strong>${fmt$(c.paid_deposits_sum)}</strong><br>Total deposits collected</div>
      </div>
    </div>`;

  // Stat grid
  html += `
    <div class="ov-jump">
      <a href="/admin-hotspots">Target markets →</a>
      <a href="#listings">Listings</a>
      <a href="#customers">Buyers</a>
      <a href="#prospects">Invite queue</a>
      <a href="#hardware">Hardware leads</a>
      <a href="#disputes">Disputes</a>
      <a href="/admin-moderation">Moderate listings</a>
    </div>
    <div class="ov-grid">
      <div class="ov-stat"><p class="lab">Active listings</p><div class="v">${c.listings_active || 0}<small>${c.listings_draft ? c.listings_draft + ' draft' : 'animals'}</small></div></div>
      <div class="ov-stat"><p class="lab">Active reservations</p><div class="v">${c.reservations_active || 0}<small>buyers</small></div></div>
      <div class="ov-stat"><p class="lab">Verified farms</p><div class="v">${c.farms || 0}<small>ranches</small></div></div>
      <div class="ov-stat"><p class="lab">Processors</p><div class="v">${c.processors || 0}<small>plants</small></div></div>
      <div class="ov-stat"><p class="lab">Buyers</p><div class="v">${c.buyers || 0}<small>of ${c.users || 0} accounts</small></div></div>
      <div class="ov-stat" style="${c.prospects_new > 0 ? 'background: linear-gradient(135deg, #e8f3ea, #d4e8d6);' : ''}"><p class="lab">Prospects to invite</p><div class="v">${c.prospects_new || 0}<small>farms + plants</small></div></div>
      <div class="ov-stat" style="${c.disputes_open > 0 ? 'background: linear-gradient(135deg, #fff5e6, #ffe9c2);' : ''}"><p class="lab">Open disputes</p><div class="v">${c.disputes_open || 0}<small>${c.disputes_open ? fmt$(c.disputes_total_amount) : 'all clear'}</small></div></div>
      <div class="ov-stat"><p class="lab">Inst. pending review</p><div class="v">${c.institutions_pending || 0}<small>applications</small></div></div>
      <div class="ov-stat"><p class="lab">Inst. approved</p><div class="v">${c.institutions_approved || 0}<small>recipients</small></div></div>
      <div class="ov-stat" style="${c.leads_hot > 0 ? 'background: linear-gradient(135deg, #ffe6dc, #ffc8a8);' : ''}"><p class="lab">Hot hardware leads</p><div class="v">${c.leads_hot || 0}<small>${c.leads_new ? c.leads_new + ' new total' : 'no new'}</small></div></div>
    </div>`;

  // Recent payments + recent reservations columns
  const payments = data.recent_payments || [];
  const reservations = data.recent_reservations || [];

  const paymentsHtml = payments.length ? payments.map(p => `
    <div class="ov-row">
      <div class="meta">
        <h4>${p.email || 'Unknown buyer'} <span class="pill pill-${p.status}">${p.status}</span></h4>
        <p>${p.description || p.id}<br>${date(p.created)}</p>
      </div>
      <div class="right">${fmt$(p.amount)}<span class="s">${p.currency}</span></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No Stripe payments yet.<br><span style="opacity:.7;font-size:12px;">Once a buyer reserves with card, it shows up here.</span></div>`;

  const reservationsHtml = reservations.length ? reservations.map(r => `
    <div class="ov-row">
      <div class="meta">
        <h4>${r.animal_number ? r.animal_number + ' · ' : ''}${r.breed || r.species} <span class="pill pill-${r.status}">${r.status.replace('-', ' ')}</span></h4>
        <p>${r.buyer_email} · ${r.farm_name} · ${dateOnly(r.created_at)}</p>
      </div>
      <div class="right">${fmt$(r.deposit_amount)}<span class="s">deposit</span></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No reservations yet.</div>`;

  html += `
    <div class="ov-cols">
      <div class="ov-card">
        <h2>Recent payments<small>last ${payments.length} via Stripe</small></h2>
        ${paymentsHtml}
      </div>
      <div class="ov-card">
        <h2>Recent reservations<small>last ${reservations.length} in DB</small></h2>
        ${reservationsHtml}
      </div>
    </div>`;

  // Disputes + Institutions row (renders only when there's data)
  const disputes = data.recent_disputes || [];
  const institutions = data.recent_institutions || [];

  const disputesHtml = disputes.length ? disputes.map(d => `
    <div class="ov-row">
      <div class="meta">
        <h4>${d.animal_number ? d.animal_number + ' · ' : ''}${(d.farm_name || 'Unknown')} <span class="pill pill-warn">${(d.status || 'open').replace('_',' ')}</span></h4>
        <p>${d.reason || 'no reason code'} · ${d.buyer_email || 'unknown buyer'}${d.evidence_due ? ' · evidence due ' + dateOnly(d.evidence_due) : ''}</p>
      </div>
      <div class="right">${fmt$(d.amount)}<span class="s">disputed</span></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No active disputes.<br><span style="opacity:.7;font-size:12px;">Stripe \`charge.dispute.*\` events land here automatically.</span></div>`;

  const institutionsHtml = institutions.length ? institutions.map(i => `
    <div class="ov-row">
      <div class="meta">
        <h4>${i.legal_name} <span class="pill pill-${i.status}">${i.status}</span></h4>
        <p>${(i.type || '').replace('foodbank','food bank')} · ${i.state || '—'} · ${i.people_per_week ? i.people_per_week + ' people/wk' : 'capacity TBD'}<br>${i.contact_email}</p>
      </div>
      <div class="right"><a href="/donation-flow" style="font-size:13px;">Review →</a></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No institution applications yet.<br><span style="opacity:.7;font-size:12px;">Schools, food banks, and government agencies apply via /donation-flow.</span></div>`;

  html += `
    <div class="ov-cols" id="disputes">
      <div class="ov-card">
        <h2>Open disputes<small>${disputes.length || 0} from Stripe</small></h2>
        ${disputesHtml}
      </div>
      <div class="ov-card">
        <h2>Donation Depot — institution queue<small>${institutions.length || 0} latest</small></h2>
        ${institutionsHtml}
      </div>
    </div>`;

  // ─── Hardware leads queue ───
  const leads = data.recent_leads || [];
  const tempColor = (t) => t === 'hot' ? '#c25250' : t === 'warm' ? '#d57f30' : '#5a6359';
  const leadsHtml = leads.length ? leads.map(l => `
    <div class="ov-row">
      <div class="meta">
        <h4>${l.full_name} <span class="pill" style="background: ${tempColor(l.temperature)}; color:#fbf9f5;">${l.temperature || 'cold'} · ${l.score || 0}</span></h4>
        <p>${l.role || ''}${l.state ? ' · ' + l.state : ''}${l.timeline ? ' · timeline ' + l.timeline : ''}${l.bundle_interest ? ' · ' + l.bundle_interest : ''}<br>${l.email}${l.phone ? ' · ' + l.phone : ''}</p>
      </div>
      <div class="right"><a href="mailto:${l.email}" style="font-size:13px;">Email →</a></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No hardware leads yet.<br><span style="opacity:.7;font-size:12px;">Quote forms from /hardware land here, scored hot/warm/cold.</span></div>`;

  html += `
    <div class="ov-cols" id="hardware">
      <div class="ov-card">
        <h2>Hardware leads<small>last ${leads.length} · scored on intake</small></h2>
        ${leadsHtml}
        <p style="margin:14px 0 0;font:500 12.5px/1.4 Inter;color:var(--ink-2)">Hotspots that say “Sell hardware” land here after a quote. <a class="ov-act" href="/admin-hotspots">Open market heat →</a></p>
      </div>
    </div>`;

  const listings = data.recent_listings || [];
  const buyers = data.recent_buyers || [];
  const listingsHtml = listings.length ? listings.map(l => {
    const otm = l.after_thirty_months || l.otm_price_pending;
    return `
    <div class="ov-row">
      <div class="meta">
        <h4>${(l.number ? l.number + ' · ' : '')}${l.breed || l.species || 'Listing'} <span class="pill pill-${l.status === 'active' ? 'paid' : 'pending'}">${l.status || '—'}</span>${otm ? ' <span class="pill pill-pending">OTM pending</span>' : ''}</h4>
        <p>${l.farm_name || 'No farm'} · ${[l.farm_city, l.farm_state].filter(Boolean).join(', ') || '—'} · ${dateOnly(l.created_at)}</p>
      </div>
      <div class="right">${l.id ? `<a class="ov-act" href="/listing?id=${encodeURIComponent(l.id)}">Open →</a>` : ''}</div>
    </div>`;
  }).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No listings yet.</div>`;

  const buyersHtml = buyers.length ? buyers.map(b => `
    <div class="ov-row">
      <div class="meta">
        <h4>${b.name || b.email || 'Buyer'}</h4>
        <p>${b.email || '—'} · ${b.zip || 'no zip'} · ${dateOnly(b.created_at)}</p>
      </div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No buyers yet.</div>`;

  html += `
    <div class="ov-cols" style="margin-top:22px">
      <div class="ov-card" id="listings">
        <h2>Latest listings<small>${c.listings_active || 0} live · ${c.listings_draft || 0} draft</small></h2>
        ${listingsHtml}
        <p style="margin:14px 0 0;font:500 12.5px/1.4 Inter;color:var(--ink-2)"><a class="ov-act" href="/admin-moderation">Moderate / withdraw →</a></p>
      </div>
      <div class="ov-card" id="customers">
        <h2>Latest buyers<small>${c.buyers || 0} on platform</small></h2>
        ${buyersHtml}
        <p style="margin:14px 0 0;font:500 12.5px/1.4 Inter;color:var(--ink-2)">Use <a class="ov-act" href="/admin-hotspots">hotspots</a> to recruit buyers in thin metros.</p>
      </div>
    </div>`;

  const prospects = data.prospect_queue || [];
  const prospectsHtml = prospects.length ? prospects.map(p => `
    <div class="ov-row">
      <div class="meta">
        <h4>${p.name || 'Prospect'} <span class="pill pill-pending">${p.kind || 'lead'} · ${p.invite_status || 'new'}</span></h4>
        <p>${[p.city, p.state].filter(Boolean).join(', ') || '—'} · ${p.source || ''} · ${p.email || p.phone || 'no contact'}</p>
      </div>
      <div class="right">${p.email
        ? `<button type="button" class="ov-btn js-invite" data-id="${p.id}">Invite</button>`
        : `<a class="ov-act" href="/map?layer=prospects">Map →</a>`}</div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />Invite queue is empty.<br><span style="opacity:.7;font-size:12px;">Import AMS farms or FSIS plants, then send from here.</span></div>`;

  html += `
    <div class="ov-cols" style="margin-top:22px">
      <div class="ov-card" id="prospects">
        <h2>Invite queue<small>${c.prospects_new || 0} waiting</small></h2>
        ${prospectsHtml}
        <p style="margin:14px 0 0;font:500 12.5px/1.4 Inter;color:var(--ink-2)">
          <a class="ov-act" href="/admin-ams-import">Import farms (AMS)</a> ·
          <a class="ov-act" href="/admin-fsis-import">Import plants (FSIS)</a> ·
          <a class="ov-act" href="/map?layer=prospects">Recruiting map</a>
        </p>
      </div>
      <div class="ov-card" id="hygiene">
        <h2>Reservation hygiene<small>${c.pending_stale || 0} stale holds</small></h2>
        <p style="font:500 13.5px/1.5 Inter;color:var(--ink-2);margin:0 0 14px">Pending reservations with no Stripe payment older than 5 minutes leak inventory. Preview, then sweep.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button type="button" class="ov-btn ghost" id="ovSweepPreview">Preview stale holds</button>
          <button type="button" class="ov-btn" id="ovSweepRun" ${c.pending_stale ? '' : 'disabled'}>Sweep ${c.pending_stale || 0}</button>
        </div>
        <p id="ovSweepNote" style="margin:12px 0 0;font:500 12.5px/1.4 Inter;color:var(--ink-2);min-height:1.2em"></p>
      </div>
    </div>`;

  root.innerHTML = html;

  root.querySelectorAll('.js-invite').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id;
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const r = await fetch('/api/admin-prospect?id=' + encodeURIComponent(id) + '&action=invite', { method: 'POST', credentials: 'include' });
        const body = await r.json().catch(() => ({}));
        btn.textContent = r.ok ? (body.email_sent ? 'Sent' : 'Marked') : 'Failed';
      } catch {
        btn.textContent = 'Failed';
        btn.disabled = false;
      }
    });
  });

  const note = document.getElementById('ovSweepNote');
  const previewBtn = document.getElementById('ovSweepPreview');
  const runBtn = document.getElementById('ovSweepRun');
  if (previewBtn) {
    previewBtn.addEventListener('click', async () => {
      previewBtn.disabled = true;
      try {
        const r = await fetch('/api/admin-sweep-pending-reservations?action=sweep', { credentials: 'include' });
        const body = await r.json().catch(() => ({}));
        if (note) note.textContent = r.ok
          ? ((body.would_sweep || 0) + ' hold' + (body.would_sweep === 1 ? '' : 's') + ' would be released.')
          : (body.error || 'Preview failed');
      } catch (e) {
        if (note) note.textContent = e.message || 'Preview failed';
      } finally {
        previewBtn.disabled = false;
      }
    });
  }
  if (runBtn) {
    runBtn.addEventListener('click', async () => {
      if (!confirm('Release stale pending holds and restore share inventory?')) return;
      runBtn.disabled = true;
      try {
        const r = await fetch('/api/admin-sweep-pending-reservations?action=sweep', { method: 'POST', credentials: 'include' });
        const body = await r.json().catch(() => ({}));
        if (note) note.textContent = r.ok
          ? ('Swept ' + (body.swept_count || 0) + (body.failed_count ? ', ' + body.failed_count + ' failed' : ''))
          : (body.error || 'Sweep failed');
      } catch (e) {
        if (note) note.textContent = e.message || 'Sweep failed';
        runBtn.disabled = false;
      }
    });
  }

  if (location.hash) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  }
})();
</script>
</body>
</html>
