<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Owner overview · Protein Outfitters</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<link rel="stylesheet" href="./theme.css" />
<link rel="stylesheet" href="./po-shell.css" />
<style>
  body { background: #fbf9f5; color: var(--ink); }
  .ov-shell { max-width: 1200px; margin: 0 auto; padding: 28px var(--shell-pad) 80px; }
  .ov-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom: 24px; }
  .ov-head h1 { font: 900 clamp(36px, 4.4vw, 56px)/1.02 var(--ff-sans); letter-spacing:-0.025em; margin: 0; }
  .ov-head .eyebrow { font: 800 12px/1 var(--ff-sans); letter-spacing:.18em; text-transform:uppercase; color: var(--ink-2); margin: 0 0 8px; }
  .ov-head p { font: 500 15px/1.5 var(--ff-sans); color: var(--ink-2); margin: 6px 0 0; max-width: 600px; }

  .ov-balance { background: linear-gradient(135deg, #061b0e 0%, #0e2c19 100%); color: #fbf9f5; border-radius: 24px; padding: 28px 32px; margin-bottom: 22px; }
  .ov-balance .lab { font: 800 11px/1 var(--ff-sans); letter-spacing: .18em; text-transform: uppercase; opacity: .65; margin: 0 0 8px; }
  .ov-balance .v { font: 900 clamp(40px, 5vw, 60px)/1 var(--ff-sans); letter-spacing: -0.03em; }
  .ov-balance .sub { font: 500 13px/1.5 var(--ff-sans); opacity: .7; margin-top: 6px; }
  .ov-balance .pending { display: flex; gap: 24px; margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.18); }
  .ov-balance .pending div { font: 600 13px/1.4 var(--ff-sans); }
  .ov-balance .pending strong { font-weight: 800; opacity: .92; }

  .ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .ov-stat { background: #fff; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(6,27,14,.04); }
  .ov-stat .lab { font: 700 11px/1 var(--ff-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 8px; }
  .ov-stat .v { font: 900 clamp(28px, 3vw, 40px)/1 var(--ff-sans); letter-spacing: -0.02em; }
  .ov-stat .v small { font-size: .55em; font-weight: 600; opacity: .55; margin-left: 4px; }

  .ov-cols { display: grid; grid-template-columns: 1.2fr .8fr; gap: 22px; }
  @media (max-width: 880px) { .ov-cols { grid-template-columns: 1fr; } }

  .ov-card { background: #fff; border-radius: 18px; padding: 22px 24px; box-shadow: 0 1px 2px rgba(6,27,14,.04); }
  .ov-card h2 { font: 800 18px/1.2 var(--ff-sans); margin: 0 0 14px; letter-spacing: -0.01em; }
  .ov-card h2 small { font: 600 12px/1 var(--ff-sans); color: var(--ink-2); margin-left: 8px; }

  .ov-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(6,27,14,.06); align-items: center; }
  .ov-row:first-child { border-top: 0; padding-top: 0; }
  .ov-row .meta h4 { margin: 0; font: 700 14px/1.3 var(--ff-sans); }
  .ov-row .meta p { margin: 3px 0 0; font: 500 12px/1.4 var(--ff-sans); color: var(--ink-2); }
  .ov-row .right { text-align: right; font: 700 14px/1 var(--ff-sans); white-space: nowrap; }
  .ov-row .right span.s { display:block; font: 600 10.5px/1.1 var(--ff-sans); margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font: 800 10px/1 var(--ff-sans); letter-spacing: .04em; text-transform: uppercase; }
  .pill-paid { background: rgba(125,160,93,.15); color: #4a6634; }
  .pill-pending { background: rgba(220,165,74,.18); color: #8a6520; }
  .pill-cancelled, .pill-refunded { background: rgba(176,74,58,.15); color: #7d2e22; }
  .pill-succeeded { background: rgba(125,160,93,.15); color: #4a6634; }
  .pill-requires_payment_method, .pill-requires_action, .pill-processing { background: rgba(220,165,74,.18); color: #8a6520; }
  .pill-canceled, .pill-failed { background: rgba(176,74,58,.15); color: #7d2e22; }

  .empty { padding: 32px 12px; text-align: center; color: var(--ink-2); font: 500 14px/1.5 var(--ff-sans); }
  .empty img { width: 56px; height: 56px; border-radius: 12px; display: block; margin: 0 auto 12px; opacity: .55; }
  .needs-auth { background: #fff; padding: 60px 24px; border-radius: 18px; text-align: center; }
  .needs-auth img { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 14px; }
</style>
</head>
<body>

<div class="po-nav-wrap">
  <nav class="po-nav">
    <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
    <div class="po-nav-links">
      <a href="/admin-overview" style="font-weight:800">Overview</a>
      <a href="/admin">Disputes</a>
      <a href="/discover">Marketplace</a>
      <a href="/producers">Producers</a>
    </div>
    <div class="po-nav-actions">
      <a href="/account" class="signin">Sign in</a>
      <button class="reserve" data-open-sheet>Reserve</button>
    </div>
  </nav>
</div>

<main class="ov-shell" id="ovBody">
  <div class="ov-head">
    <div>
      <p class="eyebrow">Owner overview</p>
      <h1>How's the marketplace doing?</h1>
      <p>Real DB counts + Stripe balance + the last 10 payments and reservations. Updates on every page load.</p>
    </div>
  </div>
  <div id="ovContent">
    <div class="empty"><img src="/brand/logo-monogram.svg" alt="" />Loading metrics…</div>
  </div>
</main>

<script src="./po-shell.js"></script>
<script>
(async function () {
  const root = document.getElementById('ovContent');
  const fmt$ = (n) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const date = (ms) => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const dateOnly = (s) => new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  let res;
  try { res = await fetch('/api/admin-metrics', { credentials: 'include' }); }
  catch (e) {
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3 style="margin:0 0 8px;font:800 18px/1.3 Inter;">Couldn't reach the API</h3><p style="font:500 14px/1.5 Inter;color:#666;">${e.message}</p></div>`;
    return;
  }
  if (res.status === 401) {
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3 style="margin:0 0 8px;font:800 18px/1.3 Inter;">Sign in to see metrics</h3><p style="font:500 14px/1.5 Inter;color:#666;">Owner overview requires a signed-in account.</p><button onclick="window.PO_API.openAuth('Sign in', 'admin')" style="margin-top:14px;background:#061b0e;color:#fbf9f5;border:0;border-radius:999px;padding:12px 22px;font:700 14px/1 Inter;cursor:pointer">Sign in</button></div>`;
    return;
  }
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    root.innerHTML = `<div class="needs-auth"><img src="/brand/logo-monogram.svg" alt=""><h3>Error</h3><p>${t.slice(0,300)}</p></div>`;
    return;
  }

  const data = await res.json();
  const c = data.counts || {};
  const balanceUSD = (data.balance?.available || []).find(b => b.currency === 'usd')?.amount || 0;
  const pendingUSD = (data.balance?.pending || []).find(b => b.currency === 'usd')?.amount || 0;

  let html = '';

  // Live balance card
  html += `
    <div class="ov-balance">
      <p class="lab">Stripe available balance</p>
      <div class="v">${fmt$(balanceUSD)}</div>
      <p class="sub">Across ${data.counts.paid_deposits_count} paid reservations.${data.stripe_error ? ' <em>(Stripe: ' + data.stripe_error + ')</em>' : ''}</p>
      <div class="pending">
        <div><strong>${fmt$(pendingUSD)}</strong><br>Pending Stripe payouts</div>
        <div><strong>${fmt$(c.pending_deposits_sum)}</strong><br>Reservations awaiting deposit</div>
        <div><strong>${fmt$(c.paid_deposits_sum)}</strong><br>Total deposits collected</div>
      </div>
    </div>`;

  // Stat grid
  html += `
    <div class="ov-grid">
      <div class="ov-stat"><p class="lab">Active listings</p><div class="v">${c.listings_active || 0}<small>animals</small></div></div>
      <div class="ov-stat"><p class="lab">Active reservations</p><div class="v">${c.reservations_active || 0}<small>buyers</small></div></div>
      <div class="ov-stat"><p class="lab">Verified farms</p><div class="v">${c.farms || 0}<small>ranches</small></div></div>
      <div class="ov-stat"><p class="lab">Processors</p><div class="v">${c.processors || 0}<small>plants</small></div></div>
      <div class="ov-stat"><p class="lab">Total accounts</p><div class="v">${c.users || 0}<small>users</small></div></div>
    </div>`;

  // Recent payments + recent reservations columns
  const payments = data.recent_payments || [];
  const reservations = data.recent_reservations || [];

  const paymentsHtml = payments.length ? payments.map(p => `
    <div class="ov-row">
      <div class="meta">
        <h4>${p.email || 'Unknown buyer'} <span class="pill pill-${p.status}">${p.status}</span></h4>
        <p>${p.description || p.id}<br>${date(p.created)}</p>
      </div>
      <div class="right">${fmt$(p.amount)}<span class="s">${p.currency}</span></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No Stripe payments yet.<br><span style="opacity:.7;font-size:12px;">Once a buyer reserves with card, it shows up here.</span></div>`;

  const reservationsHtml = reservations.length ? reservations.map(r => `
    <div class="ov-row">
      <div class="meta">
        <h4>${r.animal_number ? r.animal_number + ' · ' : ''}${r.breed || r.species} <span class="pill pill-${r.status}">${r.status.replace('-', ' ')}</span></h4>
        <p>${r.buyer_email} · ${r.farm_name} · ${dateOnly(r.created_at)}</p>
      </div>
      <div class="right">${fmt$(r.deposit_amount)}<span class="s">deposit</span></div>
    </div>`).join('') : `<div class="empty"><img src="/brand/logo-monogram.svg" alt="" />No reservations yet.</div>`;

  html += `
    <div class="ov-cols">
      <div class="ov-card">
        <h2>Recent payments<small>last ${payments.length} via Stripe</small></h2>
        ${paymentsHtml}
      </div>
      <div class="ov-card">
        <h2>Recent reservations<small>last ${reservations.length} in DB</small></h2>
        ${reservationsHtml}
      </div>
    </div>`;

  root.innerHTML = html;
})();
</script>
</body>
</html>
