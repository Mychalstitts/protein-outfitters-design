<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<title>Map · Protein Outfitters</title>
<meta name="description" content="Every farm, every processor, every market — mapped. The platform's atlas." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Leaflet.heat for the demand heatmap -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<!-- Leaflet.markercluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./po-shell.css">

<style>
  body { margin: 0; background: #fbf9f5; color: var(--ink, #061b0e); font-family: 'Inter', system-ui, sans-serif; }

  /* Layout */
  .map-page { display: grid; grid-template-rows: auto 1fr; height: 100dvh; min-height: 720px; }
  .map-frame { display: grid; grid-template-columns: 360px 1fr; height: 100%; overflow: hidden; }
  @media (max-width: 920px) { .map-frame { grid-template-columns: 1fr; grid-template-rows: 1fr 320px; } }

  /* Sidebar */
  .map-side { background: #fff; border-right: 1px solid rgba(6,27,14,.08); display: flex; flex-direction: column; overflow: hidden; }
  .map-side-head { padding: 18px 20px 14px; border-bottom: 1px solid rgba(6,27,14,.07); }
  .map-side-head h1 { font: 900 22px/1.1 'Inter'; letter-spacing: -0.02em; margin: 0 0 4px; }
  .map-side-head p { font: 500 12.5px/1.5 'Inter'; color: var(--ink-2, #5a6359); margin: 0; }
  .map-side-body { flex: 1; overflow-y: auto; padding: 8px; }
  .map-side-foot { padding: 12px 16px; border-top: 1px solid rgba(6,27,14,.07); font: 500 11.5px/1.5 'Inter'; color: var(--ink-2, #5a6359); display: flex; gap: 10px; align-items: center; }

  /* Layer tabs */
  .layer-tabs { display: flex; gap: 4px; padding: 12px 16px; background: rgba(6,27,14,.03); border-bottom: 1px solid rgba(6,27,14,.06); flex-wrap: wrap; }
  .layer-tab { flex: 1; min-width: 70px; padding: 9px 8px; border-radius: 9px; background: transparent; border: 0; font: 700 11.5px/1.2 'Inter'; color: var(--ink-2, #5a6359); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: background .15s; }
  .layer-tab:hover { background: rgba(6,27,14,.05); }
  .layer-tab.active { background: var(--ink, #061b0e); color: var(--ink-inverse, #fbf9f5); }
  .layer-tab .count { font: 800 16px/1 'Inter'; }
  .layer-tab .label { font-size: 10px; opacity: .85; letter-spacing: .04em; text-transform: uppercase; }
  .layer-tab.locked { opacity: .35; cursor: not-allowed; }
  .layer-tab.locked::after { content: '🔒'; font-size: 9px; margin-left: 4px; }

  /* List items in side panel */
  .list-item { display: flex; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; transition: background .15s; align-items: flex-start; }
  .list-item:hover { background: rgba(6,27,14,.04); }
  .list-item.active { background: rgba(125,160,93,.13); border: 1px solid rgba(125,160,93,.3); }
  .list-icon { flex-shrink: 0; width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; font: 800 11.5px/1 'Inter'; color: #fbf9f5; }
  .list-icon.farm { background: linear-gradient(135deg, #7da05d, #5a8540); }
  .list-icon.processor { background: linear-gradient(135deg, #b48a5a, #8a6840); }
  .list-icon.demand { background: linear-gradient(135deg, #d39c1f, #a17714); }
  .list-icon.opportunity { background: linear-gradient(135deg, #c25250, #963d3b); }
  .list-body { flex: 1; min-width: 0; }
  .list-title { font: 700 13px/1.3 'Inter'; color: var(--ink, #061b0e); margin: 0 0 2px; }
  .list-meta { font: 500 11.5px/1.4 'Inter'; color: var(--ink-2, #5a6359); margin: 0; }
  .list-pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 700 9.5px/1.5 'Inter'; letter-spacing: .04em; text-transform: uppercase; margin-right: 4px; }
  .list-pill.green { background: rgba(125,160,93,.18); color: #2d4a18; }
  .list-pill.red   { background: rgba(194,82,80,.16); color: #963d3b; }
  .list-pill.orange { background: rgba(211,156,31,.18); color: #6b4f00; }
  .list-empty { padding: 36px 16px; text-align: center; color: var(--ink-2, #5a6359); font: 500 13px/1.5 'Inter'; }

  /* Map canvas */
  .map-canvas { position: relative; }
  #leafletMap { width: 100%; height: 100%; background: #f5f1e8; }

  .map-loading { position: absolute; inset: 0; display: grid; place-items: center; background: #f5f1e8; z-index: 999; pointer-events: none; transition: opacity .2s; }
  .map-loading.hide { opacity: 0; pointer-events: none; }
  .map-loading .spinner { width: 36px; height: 36px; border: 3px solid rgba(6,27,14,.1); border-top-color: #7da05d; border-radius: 999px; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Top header */
  .map-top { background: var(--ink, #061b0e); color: var(--ink-inverse, #fbf9f5); padding: 12px 22px; display: flex; gap: 18px; align-items: center; }
  .map-top a { color: var(--ink-inverse, #fbf9f5); text-decoration: none; font: 800 14px/1 'Inter'; letter-spacing: -0.01em; }
  .map-top .stats { margin-left: auto; display: flex; gap: 18px; font: 600 12px/1 'Inter'; color: rgba(251,249,245,.75); }
  .map-top .stats strong { color: #cfe9d3; font-weight: 800; margin-right: 4px; }

  /* Custom Leaflet marker styles */
  .pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 999px 999px 999px 0; transform: rotate(-45deg); border: 2px solid #fbf9f5; box-shadow: 0 4px 10px rgba(6,27,14,.25); }
  .pin > * { transform: rotate(45deg); color: #fbf9f5; font: 900 11px/1 'Inter'; }
  .pin.farm { background: #7da05d; }
  .pin.processor { background: #b48a5a; }
  .pin.opportunity { background: #c25250; }
  .pin.prospect { background: #6b7c93; }
  .pin.prospect.contacted { background: #4a8baf; }
  .list-icon.prospect { background: linear-gradient(135deg, #6b7c93, #4a5868); }
  .list-pill.gray { background: rgba(107,124,147,.18); color: #4a5868; }
  .list-pill.blue { background: rgba(74,139,175,.18); color: #2a5d7a; }

  /* Popup */
  .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: 0 12px 30px rgba(6,27,14,.18); padding: 0; }
  .leaflet-popup-content { margin: 14px 16px; font: 500 13px/1.45 'Inter'; }
  .leaflet-popup-content h4 { font: 800 14px/1.2 'Inter'; margin: 0 0 6px; color: var(--ink, #061b0e); }
  .leaflet-popup-content p { margin: 0 0 4px; color: var(--ink-2, #5a6359); }
  .leaflet-popup-content .cta { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 999px; background: var(--ink, #061b0e); color: var(--ink-inverse, #fbf9f5); font: 700 11.5px/1 'Inter'; text-decoration: none; }

  /* Heatmap legend */
  .map-legend { position: absolute; bottom: 18px; right: 18px; background: rgba(255,255,255,.95); padding: 10px 14px; border-radius: 12px; box-shadow: 0 4px 14px rgba(6,27,14,.12); font: 600 11.5px/1.4 'Inter'; z-index: 500; max-width: 240px; }
  .map-legend h5 { margin: 0 0 6px; font: 800 11px/1 'Inter'; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2, #5a6359); }
  .map-legend .scale { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .map-legend .scale-bar { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #cfe9d3, #d39c1f, #c25250); }
  .map-legend .scale-end { font: 600 10px/1 'Inter'; color: var(--ink-2, #5a6359); }
</style>
</head>

<body>

<div class="map-page">
  <header class="map-top">
    <a href="/">PROTEIN OUTFITTERS</a>
    <span style="opacity:.5;">·</span>
    <span style="font-weight:600;">Atlas</span>
    <div class="stats" id="topStats"></div>
  </header>

  <div class="map-frame">
    <aside class="map-side">
      <div class="map-side-head">
        <h1 id="layerTitle">Loading…</h1>
        <p id="layerLead">Mapping every farm, processor, and market across the upper Midwest.</p>
      </div>

      <div class="layer-tabs" id="layerTabs">
        <button class="layer-tab active" data-layer="farms" type="button">
          <span class="count" id="cFarms">—</span><span class="label">Farms</span>
        </button>
        <button class="layer-tab" data-layer="processors" type="button">
          <span class="count" id="cProc">—</span><span class="label">Processors</span>
        </button>
        <button class="layer-tab locked" data-layer="demand" type="button">
          <span class="count" id="cDemand">—</span><span class="label">Demand</span>
        </button>
        <button class="layer-tab locked" data-layer="opportunity" type="button">
          <span class="count" id="cOpp">—</span><span class="label">Hardware</span>
        </button>
        <button class="layer-tab locked" data-layer="prospects" type="button">
          <span class="count" id="cProspects">—</span><span class="label">Prospects</span>
        </button>
      </div>

      <div class="map-side-body" id="sideList">
        <div class="list-empty">Loading…</div>
      </div>

      <div class="map-side-foot">
        <span id="footStat">—</span>
        <span style="margin-left:auto;"><a href="/discover" style="color:inherit;text-decoration:none;font-weight:700;">Browse listings →</a></span>
      </div>
    </aside>

    <div class="map-canvas">
      <div id="leafletMap"></div>
      <div class="map-loading" id="mapLoading"><div class="spinner"></div></div>
      <div class="map-legend" id="mapLegend" style="display:none;">
        <h5>Demand intensity</h5>
        <div>Buyer signups by ZIP, last 90 days</div>
        <div class="scale"><span class="scale-end">low</span><div class="scale-bar"></div><span class="scale-end">high</span></div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── Map init ─────────────────────────────────────────────────
  const map = L.map('leafletMap', {
    zoomControl: true,
    attributionControl: true,
  }).setView([45.5, -94], 5);

  // Style: muted earth-tone tiles to match the brand
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  // Custom HTML pin
  function pinIcon(kind, label = '') {
    return L.divIcon({
      className: 'po-pin-wrapper',
      html: `<div class="pin ${kind}"><span>${label || ''}</span></div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -28],
    });
  }

  // ── Layer state ──────────────────────────────────────────────
  const layers = {
    farms: L.markerClusterGroup({ disableClusteringAtZoom: 9 }),
    processors: L.markerClusterGroup({ disableClusteringAtZoom: 9 }),
    demand: L.layerGroup(),
    opportunity: L.layerGroup(),
    prospects: L.markerClusterGroup({ disableClusteringAtZoom: 9 }),
  };
  let heatLayer = null;
  let currentLayer = 'farms';
  let DATA = { farms: [], processors: [], demand: [], opportunity: [], is_admin: false };

  // ── Layer title metadata ─────────────────────────────────────
  const LAYER_META = {
    farms: {
      title: 'Farms',
      lead: 'Every farm with a profile on Protein Outfitters. Click a pin to see who they are and what they\'re raising.',
    },
    processors: {
      title: 'Processors',
      lead: 'USDA / state-inspected processors and lockers. Buyers rely on these for cut and wrap; farmers schedule drop-offs here.',
    },
    demand: {
      title: 'Customer demand',
      lead: 'Where buyer signups concentrate. Heatmap intensity shows real demand for whole-animal protein — recruit farms here.',
    },
    opportunity: {
      title: 'Hardware sales targets',
      lead: 'Zips with active demand but no processor within 60 miles. Each red pin is a place where a new MHU pays back fast — book demos here.',
    },
    prospects: {
      title: 'Recruiting prospects',
      lead: 'Farms and processors found in USDA FSIS / AAMP / Eat Wild data who haven\'t signed up yet. Click a pin to send a recruiting email or mark contacted.',
    },
  };

  // ── Render side list ─────────────────────────────────────────
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function initials(s) {
    return String(s || '?').split(/[\s.&-]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  }

  function renderSideList() {
    const el = document.getElementById('sideList');
    const meta = LAYER_META[currentLayer];
    document.getElementById('layerTitle').textContent = meta.title;
    document.getElementById('layerLead').textContent = meta.lead;

    let items = [];
    if (currentLayer === 'farms') {
      items = DATA.farms.map(f => ({
        kind: 'farm',
        title: f.name,
        meta: `${f.city || ''}${f.state ? ', ' + f.state : ''}${f.listings_count ? ' · ' + f.listings_count + ' listing' + (f.listings_count === 1 ? '' : 's') : ''}`,
        pills: (f.identity || []).slice(0, 2).map(t => ({ text: t.replace(/-/g, ' '), color: 'green' })),
        lat: f.lat, lng: f.lng, link: f.slug ? '/farm/' + f.slug : null,
      }));
    } else if (currentLayer === 'processors') {
      items = DATA.processors.map(p => ({
        kind: 'processor',
        title: p.name,
        meta: `${p.city || ''}${p.state ? ', ' + p.state : ''}${p.inspection ? ' · ' + p.inspection.toUpperCase() + ' inspected' : ''}`,
        pills: (p.species || []).slice(0, 3).map(t => ({ text: t, color: 'orange' })),
        lat: p.lat, lng: p.lng, link: null,
      }));
    } else if (currentLayer === 'demand') {
      items = DATA.demand.slice(0, 60).map(d => ({
        kind: 'demand',
        title: 'ZIP ' + d.zip,
        meta: `${d.user_count} buyer${d.user_count === 1 ? '' : 's'} · ${d.reservation_count} reservation${d.reservation_count === 1 ? '' : 's'} (90d)`,
        pills: [],
        lat: d.lat, lng: d.lng, link: null,
      }));
    } else if (currentLayer === 'opportunity') {
      items = DATA.opportunity.filter(o => o.hardware_target).slice(0, 60).map(o => ({
        kind: 'opportunity',
        title: 'ZIP ' + o.zip + ' · ' + o.user_count + ' buyer' + (o.user_count === 1 ? '' : 's'),
        meta: o.nearest_processor_miles == null ? 'No processor in our network' : `Nearest processor: ${o.nearest_processor_miles} mi away`,
        pills: [{ text: 'hardware target', color: 'red' }],
        lat: o.lat, lng: o.lng, link: null,
      }));
    } else if (currentLayer === 'prospects') {
      items = (DATA.prospects || []).slice(0, 100).map(p => ({
        kind: 'prospect',
        title: p.name,
        meta: `${p.kind === 'farm' ? '🌾' : '🔪'} ${p.city || ''}${p.state ? ', ' + p.state : ''} · source: ${p.source}`,
        pills: [
          { text: p.invite_status, color: p.invite_status === 'sent' ? 'blue' : (p.invite_status === 'clicked' ? 'green' : 'gray') }
        ],
        lat: p.lat, lng: p.lng, link: null, prospect_id: p.id,
      }));
    }

    if (!items.length) {
      el.innerHTML = `<div class="list-empty">No ${meta.title.toLowerCase()} on the map yet.</div>`;
      return;
    }

    el.innerHTML = items.map((it, i) => `
      <div class="list-item" data-idx="${i}" data-lat="${it.lat}" data-lng="${it.lng}">
        <span class="list-icon ${it.kind}">${escapeHtml(initials(it.title))}</span>
        <div class="list-body">
          <p class="list-title">${escapeHtml(it.title)}</p>
          <p class="list-meta">${escapeHtml(it.meta)}</p>
          ${it.pills.map(p => `<span class="list-pill ${p.color}">${escapeHtml(p.text)}</span>`).join('')}
        </div>
      </div>
    `).join('');

    el.querySelectorAll('.list-item').forEach(node => {
      node.addEventListener('click', () => {
        const lat = parseFloat(node.getAttribute('data-lat'));
        const lng = parseFloat(node.getAttribute('data-lng'));
        if (Number.isFinite(lat) && Number.isFinite(lng)) {
          map.setView([lat, lng], 11, { animate: true });
        }
      });
    });

    document.getElementById('footStat').textContent = `${items.length} ${meta.title.toLowerCase()} shown`;
  }

  // ── Build map layers ─────────────────────────────────────────
  function buildFarmsLayer() {
    layers.farms.clearLayers();
    DATA.farms.forEach(f => {
      const m = L.marker([f.lat, f.lng], { icon: pinIcon('farm') });
      m.bindPopup(`
        <h4>${escapeHtml(f.name)}</h4>
        <p>${escapeHtml(f.city || '')}${f.state ? ', ' + f.state : ''}</p>
        ${f.listings_count ? `<p><strong>${f.listings_count}</strong> active listing${f.listings_count === 1 ? '' : 's'}</p>` : '<p style="opacity:.6">No active listings</p>'}
        ${f.slug ? `<a class="cta" href="/farm/${escapeHtml(f.slug)}">Visit profile →</a>` : ''}
      `);
      layers.farms.addLayer(m);
    });
  }

  function buildProcessorsLayer() {
    layers.processors.clearLayers();
    DATA.processors.forEach(p => {
      const m = L.marker([p.lat, p.lng], { icon: pinIcon('processor') });
      m.bindPopup(`
        <h4>${escapeHtml(p.name)}</h4>
        <p>${escapeHtml(p.city || '')}${p.state ? ', ' + p.state : ''}</p>
        ${p.inspection ? `<p>Inspection: <strong>${escapeHtml(p.inspection.toUpperCase())}</strong></p>` : ''}
        ${p.species?.length ? `<p>Species: ${escapeHtml(p.species.join(', '))}</p>` : ''}
      `);
      layers.processors.addLayer(m);
    });
  }

  function buildDemandLayer() {
    layers.demand.clearLayers();
    if (heatLayer) {
      map.removeLayer(heatLayer);
      heatLayer = null;
    }
    if (!DATA.demand.length) return;
    const points = DATA.demand.map(d => [d.lat, d.lng, Math.min(1, d.user_count / 10)]);
    heatLayer = L.heatLayer(points, {
      radius: 35, blur: 25, maxZoom: 11,
      gradient: { 0.0: '#cfe9d3', 0.4: '#d39c1f', 0.7: '#c25250', 1.0: '#7d2c2a' },
    });
  }

  function buildOpportunityLayer() {
    layers.opportunity.clearLayers();
    DATA.opportunity.filter(o => o.hardware_target).forEach(o => {
      const m = L.marker([o.lat, o.lng], { icon: pinIcon('opportunity') });
      m.bindPopup(`
        <h4>ZIP ${escapeHtml(o.zip)}</h4>
        <p><strong>${o.user_count}</strong> buyer${o.user_count === 1 ? '' : 's'} · ${o.reservation_count} reservation${o.reservation_count === 1 ? '' : 's'} (90d)</p>
        <p>${o.nearest_processor_miles == null ? 'No processor in network' : 'Nearest processor: <strong>' + o.nearest_processor_miles + ' mi</strong>'}</p>
        <a class="cta" href="/hardware?utm_source=map&utm_medium=opportunity&utm_zip=${escapeHtml(o.zip)}">Recruit this area →</a>
      `);
      layers.opportunity.addLayer(m);
    });
  }

  function buildProspectsLayer() {
    layers.prospects.clearLayers();
    (DATA.prospects || []).forEach(p => {
      const isContacted = ['sent', 'clicked', 'queued'].includes(p.invite_status);
      const m = L.marker([p.lat, p.lng], { icon: pinIcon('prospect' + (isContacted ? ' contacted' : '')) });
      const channel = p.email ? `email: <code>${escapeHtml(p.email)}</code>` : (p.phone ? `phone: ${escapeHtml(p.phone)}` : 'no contact info');
      m.bindPopup(`
        <h4>${escapeHtml(p.name)}</h4>
        <p>${escapeHtml(p.kind === 'farm' ? '🌾 Farm' : '🔪 Processor')} · ${escapeHtml(p.city || '')}${p.state ? ', ' + p.state : ''}</p>
        <p>Source: <strong>${escapeHtml(p.source)}</strong> · status: <strong>${escapeHtml(p.invite_status)}</strong></p>
        <p>${channel}</p>
        ${p.website ? `<p><a href="${escapeHtml(p.website)}" target="_blank" rel="noopener">${escapeHtml(p.website)}</a></p>` : ''}
        <button class="cta" onclick="window.poInviteProspect('${escapeHtml(p.id)}', this)">${isContacted ? 'Re-send invite →' : 'Send recruiting email →'}</button>
      `);
      layers.prospects.addLayer(m);
    });
  }

  // Exposed globally so the popup buttons can call it
  window.poInviteProspect = async function (id, btn) {
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const r = await fetch('/api/admin-prospect?id=' + encodeURIComponent(id) + '&action=invite', {
        method: 'POST',
        credentials: 'include',
      });
      const data = await r.json();
      if (r.ok) {
        btn.textContent = '✓ ' + (data.email_sent ? 'Email sent' : 'Marked invited');
        setTimeout(() => map.closePopup(), 1500);
        // Optimistically refresh the data
        setTimeout(load, 1800);
      } else {
        btn.disabled = false; btn.textContent = 'Failed: ' + (data.error || r.status);
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Network error';
    }
  };

  function showLayer(name) {
    currentLayer = name;
    Object.values(layers).forEach(l => map.removeLayer(l));
    if (heatLayer) map.removeLayer(heatLayer);

    document.querySelectorAll('.layer-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.layer === name);
    });

    if (name === 'farms') {
      map.addLayer(layers.farms);
      document.getElementById('mapLegend').style.display = 'none';
      if (DATA.farms.length) {
        const bounds = L.latLngBounds(DATA.farms.map(f => [f.lat, f.lng]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
      }
    } else if (name === 'processors') {
      map.addLayer(layers.processors);
      document.getElementById('mapLegend').style.display = 'none';
      if (DATA.processors.length) {
        const bounds = L.latLngBounds(DATA.processors.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
      }
    } else if (name === 'demand') {
      if (heatLayer) heatLayer.addTo(map);
      document.getElementById('mapLegend').style.display = 'block';
    } else if (name === 'opportunity') {
      map.addLayer(layers.opportunity);
      map.addLayer(layers.processors);  // show processors as context
      document.getElementById('mapLegend').style.display = 'none';
    } else if (name === 'prospects') {
      map.addLayer(layers.prospects);
      document.getElementById('mapLegend').style.display = 'none';
      if (DATA.prospects?.length) {
        const bounds = L.latLngBounds(DATA.prospects.map(p => [p.lat, p.lng]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 7 });
      }
    }
    renderSideList();
  }

  // ── Load data ────────────────────────────────────────────────
  async function load() {
    try {
      const r = await fetch('/api/map-data', { credentials: 'include' });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'failed');
      DATA = data;

      // Stats banner
      document.getElementById('topStats').innerHTML = `
        <span><strong>${data.counts.farms}</strong>farms</span>
        <span><strong>${data.counts.processors}</strong>processors</span>
        ${data.is_admin ? `<span><strong>${data.counts.demand_zips}</strong>demand zips</span><span style="color:#f6c5c4;"><strong>${data.counts.opportunity_targets}</strong>hardware targets</span><span style="color:#cfe9d3;"><strong>${data.counts.prospects_new || 0}</strong>new prospects</span>` : ''}
      `;
      // Counters
      document.getElementById('cFarms').textContent = data.counts.farms;
      document.getElementById('cProc').textContent = data.counts.processors;
      document.getElementById('cDemand').textContent = data.is_admin ? data.counts.demand_zips : '🔒';
      document.getElementById('cOpp').textContent = data.is_admin ? data.counts.opportunity_targets : '🔒';
      const cProspectsEl = document.getElementById('cProspects');
      if (cProspectsEl) cProspectsEl.textContent = data.is_admin ? (data.prospects?.length ?? 0) : '🔒';

      // Unlock admin tabs
      if (data.is_admin) {
        document.querySelectorAll('.layer-tab.locked').forEach(t => t.classList.remove('locked'));
      }

      buildFarmsLayer();
      buildProcessorsLayer();
      if (data.is_admin) {
        buildDemandLayer();
        buildOpportunityLayer();
        buildProspectsLayer();
      }
      showLayer('farms');
      document.getElementById('mapLoading').classList.add('hide');
    } catch (e) {
      document.getElementById('mapLoading').innerHTML = `<div style="text-align:center;color:#a13a3a;font:600 13px Inter;padding:20px;">Couldn't load map.<br><span style="color:rgba(6,27,14,.5);">${escapeHtml(e.message || '')}</span></div>`;
    }
  }

  document.querySelectorAll('.layer-tab').forEach(t => {
    t.addEventListener('click', () => {
      if (t.classList.contains('locked')) return;
      showLayer(t.dataset.layer);
    });
  });

  load();
})();
</script>
<div id="po-shell-host"></div>
<script src="./po-shell.js"></script>

</body>
</html>
