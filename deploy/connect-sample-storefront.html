<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<title>Storefront · Protein Outfitters</title>
<meta name="description" content="Buy from a connected account. Sample Stripe Connect storefront." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/po-shell.css">
<style>
.sf-shell { padding: clamp(40px, 5vw, 64px) var(--shell-pad) clamp(80px, 10vw, 120px); }
.sf-inner { max-width: 960px; margin: 0 auto; }
.sf-eye { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 12px; }
.sf-inner h1 { margin: 0; font-size: clamp(32px, 4vw, 48px); letter-spacing: -0.03em; }
.sf-lead { margin: 12px 0 28px; color: var(--ink-2); font-size: 16px; max-width: 50ch; line-height: 1.5; }
.sf-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .sf-grid { grid-template-columns: 1fr 1fr; } }
.sf-card { background: #fff; border-radius: 22px; padding: 22px; box-shadow: 0 1px 2px rgba(0,0,0,0.03), 0 4px 14px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 10px; }
.sf-card h2 { margin: 0; font-size: 18px; }
.sf-card p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.45; flex: 1; }
.sf-price { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.sf-btn {
  appearance: none; border: 0; cursor: pointer;
  background: var(--brand); color: #fbf9f5; border-radius: 999px;
  padding: 12px 16px; font: 700 14px/1 Inter, sans-serif; align-self: flex-start;
}
.sf-btn[disabled] { opacity: .45; }
.sf-msg { color: var(--over); font-size: 14px; }
.sf-note { font-size: 12px; color: var(--ink-3); margin-top: 24px; }
</style>
</head>
<body>
<div class="po-nav-wrap">
  <nav class="po-nav">
    <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
    <div class="po-nav-links">
      <a href="/connect-sample">Collect payments</a>
    </div>
    <div class="po-nav-actions"><a href="/account" class="signin">Sign in</a></div>
  </nav>
</div>

<section class="sf-shell">
  <div class="sf-inner">
    <p class="sf-eye">Connected-account storefront</p>
    <h1 id="sfTitle">Store</h1>
    <p class="sf-lead">Tap Buy. Stripe Checkout handles the card. This is the sample storefront — not the livestock reserve sheet.</p>
    <div class="sf-grid" id="sfGrid"></div>
    <p class="sf-msg" id="sfMsg"></p>
    <!--
      Demo URL uses the Stripe account id (?accountId=acct_…).
      In production, use a farm slug or other public identifier and
      look up stripe_account_id on the server. Do not put acct_ in
      customer-facing URLs long term.
    -->
    <p class="sf-note">Sample storefront. Livestock checkout stays gated.</p>
  </div>
</section>

<div id="po-shell-host"></div>
<script src="/po-shell.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  // Path /connect-sample/storefront/:id is rewritten here; also accept ?accountId=
  const fromPath = location.pathname.split('/').filter(Boolean);
  const pathId = fromPath[2] && fromPath[2].startsWith('acct_') ? fromPath[2] : '';
  const accountId = params.get('accountId') || pathId;

  const grid = document.getElementById('sfGrid');
  const msg = document.getElementById('sfMsg');

  if (!accountId) {
    msg.textContent = 'Missing accountId. Open this page from Collect payments → Open storefront.';
    return;
  }

  async function buy(productId, btn) {
    btn.disabled = true;
    try {
      const r = await fetch('/api/connect-sample-checkout', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ accountId, productId, quantity: 1 }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
      window.location.href = data.url;
    } catch (e) {
      msg.textContent = e.message;
      btn.disabled = false;
    }
  }

  fetch('/api/connect-sample-products?accountId=' + encodeURIComponent(accountId))
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      if (!ok) throw new Error(d.error || 'Could not load products');
      document.getElementById('sfTitle').textContent = 'Store';
      if (!(d.products || []).length) {
        msg.textContent = 'Nothing for sale yet.';
        return;
      }
      d.products.forEach((p) => {
        const card = document.createElement('article');
        card.className = 'sf-card';
        const dollars = p.unit_amount != null ? '$' + (p.unit_amount / 100).toFixed(2) : '';
        card.innerHTML = '<h2></h2><p></p><div class="sf-price"></div><button class="sf-btn" type="button">Buy</button>';
        card.querySelector('h2').textContent = p.name;
        card.querySelector('p').textContent = p.description || '';
        card.querySelector('.sf-price').textContent = dollars;
        card.querySelector('button').addEventListener('click', (ev) => buy(p.id, ev.currentTarget));
        grid.appendChild(card);
      });
    })
    .catch((e) => { msg.textContent = e.message; });
})();
</script>
</body>
</html>
