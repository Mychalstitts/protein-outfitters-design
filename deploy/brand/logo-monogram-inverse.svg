<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Protein Outfitters monogram">
  <defs>
    <style>
      .bg { fill: #fbf9f5; }
      .mono { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; fill: #061b0e; font-size: 110px; letter-spacing: -8px; }
      .tick { stroke: #061b0e; stroke-width: 4; stroke-linecap: square; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="200" height="200" rx="36" ry="36"/>
  <text class="mono" x="32" y="138">PO</text>
  <line class="tick" x1="32" y1="158" x2="168" y2="158"/>
</svg>
