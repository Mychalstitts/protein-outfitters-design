<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<title>Notifications · Protein Outfitters</title>
<meta name="description" content="Every reservation update, payout, and reminder — in one inbox." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./po-shell.css">

<style>
  .notif-page { max-width: 760px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) 0 80px; }
  .notif-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .notif-head h1 { font: 900 clamp(28px, 4vw, 36px)/1.05 'Inter'; letter-spacing: -0.02em; margin: 0; }
  .notif-head p { color: var(--ink-2, #5a6359); font: 500 14px/1.45 'Inter'; margin: 6px 0 0; }
  .notif-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .notif-actions button { padding: 8px 14px; border-radius: 999px; background: rgba(6,27,14,.06); color: var(--ink, #061b0e); border: 0; font: 700 12.5px/1 'Inter'; cursor: pointer; }
  .notif-actions button:hover { background: rgba(6,27,14,.1); }
  .notif-actions button.primary { background: var(--ink, #061b0e); color: var(--ink-inverse, #fbf9f5); }
  .notif-actions button.primary:hover { background: #1a201d; }

  .filter-tabs { display: inline-flex; gap: 4px; padding: 4px; background: rgba(6,27,14,.04); border-radius: 999px; margin-bottom: 16px; }
  .filter-tabs button { padding: 7px 14px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-2, #5a6359); font: 700 12px/1 'Inter'; cursor: pointer; }
  .filter-tabs button.active { background: #fff; color: var(--ink, #061b0e); box-shadow: 0 2px 6px rgba(6,27,14,.06); }

  .notif-card { background: #fff; border-radius: 18px; padding: 8px; box-shadow: 0 4px 18px rgba(6,27,14,.05); }
  .notif-row { display: flex; gap: 14px; padding: 14px 16px; border-radius: 12px; text-decoration: none; color: inherit; }
  .notif-row:hover { background: rgba(6,27,14,.04); }
  .notif-row.unread { background: rgba(125,160,93,.08); }
  .notif-row.unread:hover { background: rgba(125,160,93,.14); }
  .notif-icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 999px; background: linear-gradient(135deg, #7da05d, #b48a5a); color: #fbf9f5; display: grid; place-items: center; font: 600 20px/1 'Material Symbols Outlined','Material Icons'; font-variation-settings: 'FILL' 0, 'wght' 500; }
  .notif-meta-row { font: 500 11.5px/1 'Inter'; color: var(--ink-2, #5a6359); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .notif-pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(6,27,14,.07); font: 700 9.5px/1.4 'Inter'; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2, #5a6359); }
  .notif-pill.new { background: #7da05d; color: #fff; }
  .notif-title { font: 700 14px/1.4 'Inter'; color: var(--ink, #061b0e); margin: 0 0 3px; }
  .notif-body { font: 500 12.5px/1.5 'Inter'; color: var(--ink-2, #5a6359); margin: 0; }
  .notif-empty { padding: 60px 20px; text-align: center; color: var(--ink-2, #5a6359); }
  .notif-empty h3 { margin: 0 0 8px; font: 800 18px/1.3 'Inter'; color: var(--ink, #061b0e); }
  .notif-empty p { margin: 0; font: 500 13.5px/1.55 'Inter'; }

  .auth-required { padding: 80px 20px; text-align: center; }
  .auth-required h2 { font: 900 22px/1.2 'Inter'; margin: 0 0 8px; }
  .auth-required p { font: 500 14px/1.5 'Inter'; color: var(--ink-2, #5a6359); margin: 0 0 24px; }
  .auth-required button { padding: 12px 22px; border-radius: 999px; background: var(--ink, #061b0e); color: var(--ink-inverse, #fbf9f5); border: 0; font: 800 13px/1 'Inter'; cursor: pointer; }
</style>
</head>

<body>

<header class="glass-nav">
  <div class="container">
    <nav class="row row--between" style="padding: 14px 0;">
      <a href="/" style="font-weight: 900; font-size: 16px; text-transform: uppercase; text-decoration: none; color: inherit;">Protein Outfitters</a>
      <div class="po-nav-actions"><a href="/account" style="font-weight:700;font-size:13px;text-decoration:none;color:inherit;">Account</a></div>
    </nav>
  </div>
</header>

<div class="container">
  <div class="notif-page">
    <div id="signedOut" class="auth-required" hidden>
      <h2>Sign in to view notifications</h2>
      <p>Reservation updates, payouts, and reminders all land here.</p>
      <button onclick="window.PO_API && window.PO_API.openAuth && window.PO_API.openAuth('Sign in to view your notifications')">Sign in</button>
    </div>

    <div id="signedIn" hidden>
      <div class="notif-head">
        <div>
          <h1>Notifications</h1>
          <p id="unreadSummary">Loading…</p>
        </div>
        <div class="notif-actions">
          <button id="markAllBtn">Mark all read</button>
          <button id="refreshBtn" class="primary">Refresh</button>
        </div>
      </div>

      <div class="filter-tabs" role="tablist">
        <button class="active" data-filter="all" type="button">All</button>
        <button data-filter="unread" type="button">Unread</button>
      </div>

      <div id="pushBanner" hidden style="margin:14px 0;padding:14px 18px;background:rgba(125,160,93,0.12);border:1px solid rgba(125,160,93,0.35);border-radius:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;">
        <div style="font:600 13px/1.45 'Inter';color:var(--ink,#061b0e);max-width:520px;">
          <strong style="font-weight:800;">Get notifications on this device</strong> — pickup ready, drop-off reminders, refunds. We'll never spam.
        </div>
        <button id="enablePushBtn" type="button" style="font:700 12.5px/1 'Inter';padding:9px 16px;background:var(--ink,#061b0e);color:#fbf9f5;border-radius:999px;border:0;cursor:pointer;letter-spacing:.03em;">Turn on →</button>
      </div>

      <div class="notif-card">
        <div id="notifList">
          <div class="notif-empty"><p>Loading…</p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/po-api.js"></script>
<script src="/po-shell.js"></script>
<script>
(function () {
  'use strict';

  let currentFilter = 'all';

  function timeAgo(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function load() {
    const list = document.getElementById('notifList');
    const summary = document.getElementById('unreadSummary');
    list.innerHTML = '<div class="notif-empty"><p>Loading…</p></div>';
    try {
      const params = currentFilter === 'unread' ? '?unread=1' : '';
      const r = await fetch('/api/notifications' + params, { credentials: 'include' });
      if (r.status === 401) {
        document.getElementById('signedOut').hidden = false;
        document.getElementById('signedIn').hidden = true;
        return;
      }
      const data = await r.json();
      const items = data.notifications || [];
      const unread = data.unread || 0;
      summary.textContent = unread > 0
        ? `${unread} unread · ${items.length} total ${currentFilter === 'unread' ? '(showing unread)' : ''}`
        : 'You\'re all caught up.';

      if (!items.length) {
        list.innerHTML = `
          <div class="notif-empty">
            <h3>${currentFilter === 'unread' ? 'No unread notifications' : 'No notifications yet'}</h3>
            <p>Reservations, drop-off bookings, payouts, and updates will land here automatically.</p>
          </div>`;
        return;
      }

      list.innerHTML = items.map(n => `
        <a class="notif-row ${n.read_at ? '' : 'unread'}" href="${escapeHtml(n.link_url || '/account')}" data-id="${escapeHtml(n.id)}">
          <span class="notif-icon">${escapeHtml(n.icon || 'notifications')}</span>
          <div style="flex:1;min-width:0;">
            <div class="notif-meta-row">
              <span>${timeAgo(n.created_at)}</span>
              ${n.read_at ? '' : '<span class="notif-pill new">New</span>'}
              <span class="notif-pill">${escapeHtml((n.kind || '').split('.')[0] || 'Update')}</span>
            </div>
            <p class="notif-title">${escapeHtml(n.title || '')}</p>
            ${n.body ? `<p class="notif-body">${escapeHtml(n.body)}</p>` : ''}
          </div>
        </a>
      `).join('');

      // Click marks the notification read (fire-and-forget; don't block nav)
      list.querySelectorAll('.notif-row').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          fetch('/api/notifications?id=' + encodeURIComponent(id), { method: 'PATCH', credentials: 'include' }).catch(() => {});
        });
      });
    } catch (e) {
      list.innerHTML = '<div class="notif-empty"><p>Couldn\'t load notifications. <a href="javascript:location.reload()">Try again →</a></p></div>';
    }
  }

  async function checkAuth() {
    try {
      const r = await fetch('/api/auth/me', { credentials: 'include' });
      if (!r.ok) throw new Error('not authed');
      const data = await r.json();
      if (!data.user) throw new Error('anonymous');
      document.getElementById('signedIn').hidden = false;
      document.getElementById('signedOut').hidden = true;
      load();
    } catch {
      document.getElementById('signedOut').hidden = false;
      document.getElementById('signedIn').hidden = true;
    }
  }

  document.querySelectorAll('.filter-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      load();
    });
  });

  document.getElementById('markAllBtn').addEventListener('click', async () => {
    try { await fetch('/api/notifications?all=1', { method: 'PATCH', credentials: 'include' }); } catch {}
    load();
  });
  document.getElementById('refreshBtn').addEventListener('click', load);

  // Show the "Turn on push" banner only when supported + not yet granted.
  // We don't auto-prompt — the user has to tap the button so the browser
  // permission request is anchored to a real interaction.
  (function showPushBannerIfApplicable() {
    const banner = document.getElementById('pushBanner');
    if (!banner) return;
    if (typeof Notification === 'undefined' || !('serviceWorker' in navigator) || !('PushManager' in window)) return;
    if (Notification.permission === 'granted' || Notification.permission === 'denied') return;
    banner.hidden = false;
  })();
  const enableBtn = document.getElementById('enablePushBtn');
  if (enableBtn) {
    enableBtn.addEventListener('click', async () => {
      enableBtn.disabled = true;
      enableBtn.textContent = 'Asking…';
      const out = window.PO_API && window.PO_API.enablePushNotifications
        ? await window.PO_API.enablePushNotifications()
        : { ok: false, reason: 'api-not-ready' };
      if (out.ok) {
        enableBtn.textContent = '✓ On';
        setTimeout(() => { document.getElementById('pushBanner').hidden = true; }, 1200);
      } else {
        enableBtn.disabled = false;
        enableBtn.textContent = 'Turn on →';
        const reason = out.reason || 'unknown';
        const msg = reason === 'permission-denied'
          ? 'You blocked notifications. Re-enable in your browser settings if you change your mind.'
          : reason === 'vapid-not-configured'
            ? 'Push notifications aren\'t enabled yet on the server side.'
            : reason === 'unsupported'
              ? 'This browser doesn\'t support push notifications.'
              : 'Couldn\'t turn on push: ' + reason;
        alert(msg);
      }
    });
  }

  checkAuth();
})();
</script>

</body>
</html>
