<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
<title>Discover · Protein Outfitters</title>
<meta name="description" content="Every animal currently reserving on Protein Outfitters. Filter by species, ranch, or harvest window." />
<meta property="og:title" content="Discover · Protein Outfitters" />
<meta property="og:description" content="Every animal currently reserving on Protein Outfitters." />
<meta property="og:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<meta property="og:url" content="https://www.proteinoutfitters.com/discover" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Discover · Protein Outfitters" />
<meta name="twitter:description" content="Every animal currently reserving on Protein Outfitters." />
<meta name="twitter:image" content="https://www.proteinoutfitters.com/brand/og-image.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./po-shell.css">
<style>
.discover-hero { padding: clamp(72px, 10vw, 140px) var(--shell-pad) clamp(40px, 5vw, 56px); }
.discover-hero-inner { max-width: 1320px; margin: 0 auto; }
.filter-bar { position: sticky; top: 64px; z-index: 60; background: rgba(251, 249, 245, 0.92); backdrop-filter: blur(12px); padding: 14px var(--shell-pad); border-bottom: 1px solid rgba(0,0,0,0.04); }
.filter-inner { max-width: 1320px; margin: 0 auto; display: flex; gap: 8px; align-items: center; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
.filter-inner::-webkit-scrollbar { display: none; }
.chip { background: var(--surface); border: 1px solid rgba(0,0,0,0.06); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; text-decoration: none; }
.chip:hover { color: var(--ink); border-color: rgba(0,0,0,0.14); }
.chip.active { background: var(--brand); color: #fbf9f5; border-color: var(--brand); }
.discover-grid-wrap { padding: clamp(40px, 5vw, 64px) var(--shell-pad) clamp(80px, 10vw, 120px); }
.discover-grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: clamp(20px, 2vw, 32px); }
</style>
</head>
<body>

<!-- po-shell:nav -->
<div class="po-nav-wrap">
  <nav class="po-nav">
    <a href="/" class="po-mark"><img src="/brand/logo-monogram.svg" alt="" aria-hidden="true">Protein Outfitters</a>
    <div class="po-nav-links"><a href="/discover" class="active">Reserve</a><a href="/#how">How it works</a><a href="/producers">Producers</a><a href="/hardware">Hardware</a></div>
    <div class="po-nav-actions"><a href="/account" class="signin">Sign in</a><button data-open-sheet>Reserve</button></div>
  </nav>
</div>

<section class="discover-hero">
  <div class="discover-hero-inner">
    <p class="po-eyebrow">Now reserving · MN · WI · ND · SD</p>
    <h1 class="po-h2">Six animals.<br>Pick one.</h1>
    <p class="po-lead">Real animals from real ranches. Tap any card to start the three-tap reserve flow.</p>
  </div>
</section>

<div class="filter-bar">
  <div class="filter-inner">
    <button class="chip active" data-filter="all">All · 6</button>
    <button class="chip" data-filter="beef">Beef · 3</button>
    <button class="chip" data-filter="pork">Pork · 1</button>
    <button class="chip" data-filter="lamb">Lamb · 1</button>
    <button class="chip" data-filter="venison">Venison · 1</button>
    <button class="chip" data-filter="poultry">Poultry · 0</button>
    <span style="flex: 1;"></span>
    <a href="/map" class="chip">Map view →</a>
  </div>
</div>

<section class="discover-grid-wrap">
  <div class="discover-grid">
    <button class="product" data-cat="beef" data-open-sheet data-animal="2641" data-name="#2641 · Black Angus steer" data-producer="Northfield Pastures · Bemidji, MN" data-photo="/angus.jpg" data-price-q="1395" data-price-h="2690" data-price-w="5180">
      <div class="product-photo" style="background-image: url('/angus.jpg');"><span class="product-tag">Reserving</span></div>
      <div class="product-meta"><span class="product-eyebrow">Beef · Grass-fed</span><h3 class="product-name">#2641 — Black Angus steer</h3><p class="product-detail">Northfield Pastures · 1,180 lb live · Harvest May 28</p><div class="product-foot"><span class="product-price">From <strong>$1,395</strong></span><span class="product-cta">Reserve →</span></div></div>
    </button>
    <button class="product" data-cat="beef" data-open-sheet data-animal="2702" data-name="#2702 · Hereford heifer" data-producer="Crow Wing Cattle Co · Brainerd, MN" data-photo="/hereford.jpg" data-price-q="1280" data-price-h="2470" data-price-w="4760">
      <div class="product-photo" style="background-image: url('/hereford.jpg');"><span class="product-tag">Reserving</span></div>
      <div class="product-meta"><span class="product-eyebrow">Beef · Grass-finished</span><h3 class="product-name">#2702 — Hereford heifer</h3><p class="product-detail">Crow Wing Cattle Co · 980 lb live · Harvest June 4</p><div class="product-foot"><span class="product-price">From <strong>$1,280</strong></span><span class="product-cta">Reserve →</span></div></div>
    </button>
    <button class="product" data-cat="beef" data-open-sheet data-animal="W04" data-name="Wagyu × Angus, half" data-producer="Northern Lights Wagyu · Park Rapids, MN" data-photo="/wagyu.jpg" data-price-q="2880" data-price-h="5500" data-price-w="0">
      <div class="product-photo" style="background-image: url('/wagyu.jpg');"><span class="product-tag">Limited</span></div>
      <div class="product-meta"><span class="product-eyebrow">Beef · Wagyu cross</span><h3 class="product-name">Wagyu × Angus, halves only</h3><p class="product-detail">Northern Lights Wagyu · 1,420 lb live · Harvest June 11</p><div class="product-foot"><span class="product-price">Half from <strong>$5,500</strong></span><span class="product-cta">Reserve →</span></div></div>
    </button>
    <button class="product" data-cat="pork" data-open-sheet data-animal="H114" data-name="Berkshire hog" data-producer="Mississippi Headwaters Farm · Bemidji, MN" data-photo="/hog.jpg" data-price-q="395" data-price-h="725" data-price-w="1380">
      <div class="product-photo" style="background-image: url('/hog.jpg');"><span class="product-tag">Reserving</span></div>
      <div class="product-meta"><span class="product-eyebrow">Pork · Heritage</span><h3 class="product-name">Berkshire hog · 280 lb</h3><p class="product-detail">Mississippi Headwaters Farm · Harvest May 22</p><div class="product-foot"><span class="product-price">From <strong>$395</strong></span><span class="product-cta">Reserve →</span></div></div>
    </button>
    <button class="product" data-cat="lamb" data-open-sheet data-animal="L08" data-name="Katahdin lamb" data-producer="Boreal Pastures · Cass Lake, MN" data-photo="/lamb.jpg" data-price-q="0" data-price-h="385" data-price-w="720">
      <div class="product-photo" style="background-image: url('/lamb.jpg');"><span class="product-tag">Reserving</span></div>
      <div class="product-meta"><span class="product-eyebrow">Lamb · Pasture-raised</span><h3 class="product-name">Katahdin lamb · 105 lb</h3><p class="product-detail">Boreal Pastures · Harvest June 1</p><div class="product-foot"><span class="product-price">Half from <strong>$385</strong></span><span class="product-cta">Reserve →</span></div></div>
    </button>
    <button class="product" data-cat="venison" data-open-sheet data-animal="V03" data-name="Wild venison share" data-producer="Itasca Wilds · Grand Rapids, MN" data-photo="/venison.jpg" data-price-q="0" data-price-h="540" data-price-w="0">
      <div class="product-photo" style="background-image: url('/venison.jpg');"><span class="product-tag">Wait list</span></div>
      <div class="product-meta"><span class="product-eyebrow">Venison · Wild-harvested</span><h3 class="product-name">Whitetail venison share</h3><p class="product-detail">Itasca Wilds · Fall 2026 harvest</p><div class="product-foot"><span class="product-price">Share from <strong>$540</strong></span><span class="product-cta">Join waitlist →</span></div></div>
    </button>
  </div>
</section>

<!-- po-shell:footer + sheet (loaded via po-shell.html include hook) -->
<div id="po-shell-host"></div>
<script src="./po-shell.js"></script>
<script>
  document.querySelectorAll('.chip[data-filter]').forEach(chip => chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-filter]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const f = chip.dataset.filter;
    document.querySelectorAll('.product').forEach(p => { p.style.display = (f === 'all' || p.dataset.cat === f) ? '' : 'none'; });
  }));
</script>
</body>
</html>
